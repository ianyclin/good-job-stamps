/* ───────── 小慶祝（滿 10） ───────── */
function tapToSkip(ms){
  return new Promise(res => {
    let done = false;
    const fin = e => {
      if (done) return; done = true;
      if (e){ e.preventDefault(); e.stopPropagation(); }   /* 跳過的那一下不能穿透去蓋章、開面板 */
      document.removeEventListener('pointerdown', fin, true);
      res();
    };
    setTimeout(fin, ms); setTimeout(() => document.addEventListener('pointerdown', fin, true), 300);
  });
}
async function celebrateTen(kid, T){
  /* 面板若正開著（例如剛按了「二寶也做了」），慶祝完要還回來——
     不然第三個孩子跟撤銷就點不到了 */
  const panelWasOpen = $('reasonPanel').classList.contains('on');
  hideReasonPanel();
  const b = $('banner');
  $('bannerT1').textContent = `${kid.name}的第 ${T} 顆星星！`;
  $('bannerT2').textContent = pick(COPY_TEN);
  anim(b, [{ transform:'translateY(-120%)' }, { transform:'translateY(0)' }], { duration:300, easing:'cubic-bezier(.34,1.56,.64,1)' });
  /* 十顆星星一顆一顆點亮：清點的不是數字，是那十件事——
     有原因的順帶浮出那句原因。第十顆亮起，全場才炸開。 */
  const lay = $('tenlay'), starsBox = $('tenStars'), line = $('tenLine');
  starsBox.textContent = ''; line.textContent = '';
  const slots = [];
  for (let i = 0; i < 10; i++){ const s = svgStar(); starsBox.append(s); slots.push(s); }
  const recent = eventsOf(kid.id).filter(e => e.type === 'plus').sort((a, b2) => a.ts - b2.ts).slice(-10);
  lay.classList.add('on');
  lay.setAttribute('aria-hidden', 'false');
  lay.style.pointerEvents = 'auto';               /* 慶祝期間由這層滿版覆蓋接住點擊，跳過時才不會誤按到底下的按鈕 */
  if (reduceMotion()){
    slots.forEach(s => s.classList.add('lit'));
    SFX.ten();                                    /* 減少動態 ≠ 靜音 */
    await wait(1400);
  } else {
    for (let i = 0; i < 10; i++){
      await wait(115);
      slots[i].classList.add('lit');
      anim(slots[i], [{ transform:'scale(.4)' }, { transform:'scale(1.35)', offset:.6 }, { transform:'scale(1)' }], 160);
      SFX.step(i);
      const r = recent[i] && recent[i].reason;
      if (r) line.textContent = r;
    }
    SFX.ten(); FX.confettiSides(80);
    /* 幫別的孩子（批次蓋）觸發的慶祝，不能放大「目前畫面上這個孩子」的總數 */
    if (kid.id === state.lastKid) anim($('heroNum'), [{ transform:'scale(1)' }, { transform:'scale(1.6)', offset:.5 }, { transform:'scale(1.6)', offset:.75 }, { transform:'scale(1)' }], { duration:600, easing:'cubic-bezier(.34,1.56,.64,1)' });
    await tapToSkip(1900);
  }
  lay.style.pointerEvents = '';
  lay.classList.remove('on');
  lay.setAttribute('aria-hidden', 'true');
  await anim(b, [{ transform:'translateY(0)' }, { transform:'translateY(-120%)' }], 200);
  if (panelWasOpen && rpJob && state.events.some(e => e.id === rpJob.id)) showReasonPanel(rpJob);
}

/* ───────── 大慶祝（滿 100） ───────── */
async function celebrateHundred(kid, T){
  closeSheet();                                   /* 動畫飛的那一秒家長順手開了紀錄頁，也不能擋住這一刻 */
  const panelWasOpen = $('reasonPanel').classList.contains('on');
  hideReasonPanel();
  const big = $('big'), star = $('bigStar'), halo = $('bigHalo'), take = $('bigTake'), skip = $('bigSkip');
  const d = new Date();
  $('bigWho').textContent = `${kid.name}・${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日`;
  $('bigH1').textContent = `${T} 顆星星！`;
  $('bigH2').textContent = pick(COPY_HUNDRED).replace('〔名字〕', kid.name).replace('〔數字〕', T);
  $('bigH1').style.opacity = '0'; $('bigH2').style.opacity = '0'; take.classList.remove('on'); skip.classList.remove('on');
  star.style.opacity = '0'; halo.style.opacity = '0';
  big.classList.add('on'); void big.offsetWidth; big.style.opacity = '1';

  let closed = false, finish = null;
  const done = new Promise(res => { finish = res; });
  const close = async withGold => {
    if (closed) return; closed = true;
    if (withGold){
      const r = take.getBoundingClientRect(); const gx = r.left + r.width/2, gy = r.top + r.height/2;
      SFX.gold();                                   /* 全 app 儀式感最重的動作，不能是無聲的 */
      FX.burst(gx, gy, true);
      state.events.push({ id:newId(), kid:kid.id, type:'gold', date:todayKey(), ts:Date.now(), reason:'', n:T }); save();
      await wait(300);
      big.style.opacity = '0'; await wait(250); big.classList.remove('on');
      renderAll();
      /* 讓孩子親眼看到自己收下的金星飛進今天的格子——儀式跟永久紀錄才連得起來 */

  take.classList.add('on');
  try { take.focus({ preventScroll:true }); } catch (err) {}
  setTimeout(() => { if (!closed) skip.classList.add('on'); }, 3000);
  await done;

/* 原因列一行拖動 or 展開多行：偏好記在資料裡，換裝置還原備份也會跟著 */
function applyReasonWrap(){

/* 選了原因之後才問「還有誰也做了？」——問的是事實，不是發福利。
   按一下＝立刻蓋（孩子當場看到）；再按一次＝悄悄收回（不出聲、不閃紅）。
   長按連蓋 N 顆時，手足也是同一批 N 顆（同一件事就同一個量，使用者拍板）。 */
function showSibs(job, reason){
  /* 「完成」實心要在守門之前設：只有一個孩子時沒有手足列，但選了原因這件事一樣成立 */
  $('rpSkip').textContent = '完成'; $('rpSkip').classList.add('fill');
  if (state.kids.length < 2) return;              /* 只有一個孩子就沒有「還有誰」 */
  const box = $('rpSibs');
  const keepScroll = box.scrollLeft;               /* 重建整列時保住捲動位置：剛按的那顆不能滑出視野害人再按一次 */
  box.textContent = '';
  job.sibStamps = job.sibStamps || {};             /* 已幫誰蓋過要記住：重選原因重建面板時不能歸零，不然會重複蓋 */
  const nB = job.batchIds ? job.batchIds.length : 1;
  box.append(h('span', { text: nB > 1 ? `這件事，還有誰也做了？（也蓋 ${nB} 顆）` : '這件事，還有誰也做了？' }));
  for (const s of state.kids.filter(k => k.id !== job.kid)){
    const cur2 = job.sibStamps[s.id];              /* {jobs, batchRef, firstTs}：收回時才能整批精準回收慶祝 */
    const b = h('button', { class: cur2 ? 'done' : null, 'aria-pressed': cur2 ? 'true' : 'false', onclick: () => {
      const oj = job.sibStamps[s.id];
      if (oj){
        /* 收回＝這一批當作沒發生：只收「這一批真的觸發過」的慶祝（batchRef 上有記），不用數字去猜 */
        const skid = kidById(s.id);
        let removed = 0;
        for (const j2 of oj.jobs){
          const i2 = state.events.findIndex(e2 => e2.id === j2.id);
          if (i2 >= 0){ state.events.splice(i2, 1); removed++; }
        }
        if (removed && skid){
          const cel = (oj.batchRef && oj.batchRef.celebrated) || [];
          if (cel.length){
            skid.celebrated = skid.celebrated.filter(m => !cel.includes(m));
            state.events = state.events.filter(e2 => !(e2.type === 'gold' && e2.kid === skid.id && cel.includes(e2.n) && e2.ts >= (oj.firstTs || 0)));
          }
          /* 這一次蓋章才寫進他清單的原因也一併收回 */
          if (job.autoAdded && job.autoAdded[s.id]){
            const w = job.autoAdded[s.id];
            const ci = skid.customReasons.indexOf(w);
            if (ci >= 0) skid.customReasons.splice(ci, 1);
            skid.recentReasons = skid.recentReasons.filter(x => x !== w);
            delete job.autoAdded[s.id];
          }
          save(); renderAll();
        }
        delete job.sibStamps[s.id];
        showSibs(job, reason); rpArm();
        return;
      }
      const k2o = kidById(s.id);
      const wasThere = !reason || REASONS.includes(reason) || (k2o && (k2o.customReasons.includes(reason) || k2o.recentReasons.includes(reason)));
      /* 同一批共用 batchRef：跨過的滿 10/100 記在上面，收回時整批一起收 */
      const ent = { jobs: [], batchRef: { celebrated: [] }, firstTs: 0 };
      for (let i2 = 0; i2 < nB; i2++){
        const sj = addStamp(s.id, job.date, reason, false);
        sj.mini = true; sj.batchRef = ent.batchRef;
        if (!ent.firstTs){
          const se0 = state.events.find(e2 => e2.id === sj.id);
          ent.firstTs = se0 ? se0.ts : Date.now();
        }
        ent.jobs.push(sj); enqueue(sj);
      }
      if (!wasThere){ job.autoAdded = job.autoAdded || {}; job.autoAdded[s.id] = reason; }
      job.sibStamps[s.id] = ent;
      showSibs(job, reason); rpArm();
    } }, avaFace(s, 20), ` ${s.name}${cur2 ? ` 也蓋了${nB > 1 ? ` ${nB} 顆` : ''} ✓` : ''}`);
    box.append(b);
  }
  box.classList.remove('hide');
  box.scrollLeft = keepScroll;
}
function hideReasonPanel(){ clearTimeout(rpTimer); $('reasonPanel').classList.remove('on'); $('rpInput').blur(); }
function setReason(job, r){
  const e = state.events.find(x => x.id === job.id); if (!e) return;
  e.reason = r; swapRemember(job, kidById(e.kid), r);
  /* 家長是「改選」原因：已經幫手足蓋出去的那幾筆（整批）也要跟著改，不能留舊原因；
     手足的「最近用過」與自動加入也跟著最終的原因走，清單才不會留一個沒人選過的舊字 */
  if (job.sibStamps){
    for (const ent of Object.values(job.sibStamps)){
      let sibKid = null;
      for (const sj of ent.jobs){
        const se = state.events.find(x => x.id === sj.id);
        if (se){ se.reason = r; sibKid = sibKid || kidById(se.kid); }
      }
      if (sibKid) swapRemember(job, sibKid, r);
    }
  }
  /* 長按連蓋的整批：原因套到每一顆 */
  if (job.batchIds){
    for (const id of job.batchIds){
      const be = state.events.find(x => x.id === id);
      if (be) be.reason = r;
    }
  }
  save();
}

  if (rpJob.batchIds){
    const kid = kidById(rpJob.kid);
    let removed = 0;
    for (const id of rpJob.batchIds){
      const i = state.events.findIndex(e => e.id === id);
      if (i >= 0){ state.events.splice(i, 1); removed++; }
    }
    if (removed && kid){
      /* 只收回「這一批真的觸發過」的慶祝（工單上有記），不用數字區間去猜——
         猜法會把歷史上早就慶祝過的里程碑一起刪掉，之後同一個滿 10 會重播 */
      const cel = (rpJob.batchRef && rpJob.batchRef.celebrated) || [];
      kid.celebrated = kid.celebrated.filter(m => !cel.includes(m));
      state.events = state.events.filter(e => !(e.type === 'gold' && e.kid === kid.id && cel.includes(e.n) && e.ts >= (rpJob.batchFirstTs || 0)));
      save(); renderAll(); toast(`已撤銷這 ${removed} 顆`);
    }
    hideReasonPanel(); return;
  }
  const orig = state.events.find(x => x.id === rpJob.id);
  const origTs = orig ? orig.ts : Infinity;
  if (orig && removeEvent(rpJob.id)){
    /* 撤銷的語意是「這一顆從來沒發生」：只有「確定是這一顆觸發的」慶祝才收回
       （看工單上的 milestone 旗標，不能用數字剛好相等去猜——
       扣一顆再蓋回同一個數字時，猜法會誤刪幾個月前那顆真正的金星）。 */
    const kid = kidById(rpJob.kid);
    if (kid && rpJob.milestone && kid.celebrated[kid.celebrated.length - 1] === rpJob.net){
      kid.celebrated.pop();
      if (rpJob.milestone === 'big'){
        const gi = state.events.findIndex(e => e.type === 'gold' && e.kid === kid.id && e.n === rpJob.net && e.ts >= origTs);
        if (gi >= 0) state.events.splice(gi, 1);
      }
    }
    save(); renderAll(); toast('已撤銷');
  }
  hideReasonPanel();
};

/* 事件清單：時間、圖示、原因（點了可改）、刪除（兩段式） */

    const tm = new Date(e.ts);
    const row = h('div', { class:'row' });
    row.append(h('span', { class:'tm', text: (e.ts && Number.isFinite(tm.getTime())) ? `${pad(tm.getHours())}:${pad(tm.getMinutes())}` : '' }));
    const ic = h('span', { class:'ic' + (e.type === 'minus' ? ' m' : e.type === 'gold' ? ' g' : '') });
    if (e.type === 'minus') ic.textContent = '−';
    else if (e.type === 'redeem') ic.textContent = '🎁';
    else if (e.type === 'adjust') ic.textContent = '✦';
    else ic.append(svgStar());
    row.append(ic);
    if (e.type === 'gold'){ row.append(h('span', { class:'rs', text:`滿 ${e.n || 100} 顆的紀念章` })); }
    else if (e.type === 'redeem'){ row.append(h('span', { class:'rs', text:`🎁 換了：${e.reason || '（沒寫品項）'} ・ 用掉 ${e.n} 顆` })); }
    else if (e.type === 'adjust'){ row.append(h('span', { class:'rs', text:`調整總好棒 ${e.n > 0 ? '+' : ''}${e.n}${e.reason ? '：' + e.reason : ''}` })); }
    else {
      const rs = h('button', { class:'rs' + (e.reason ? '' : ' empty'), text: e.reason || '沒寫原因，點一下補', onclick: () => {
        const inp = h('input', { value:e.reason, placeholder:`${kidById(e.kid).name} 做了什麼？`, maxlength:'40', enterkeyhint:'done' });
        const sv = h('button', { text:'儲存', onclick: () => { e.reason = inp.value.trim(); rememberReason(kidById(e.kid), e.reason, e.type === 'minus'); save(); refresh(); } });
        inp.addEventListener('keydown', ev => { if (ev.key === 'Enter'){ ev.preventDefault(); sv.click(); } });
        const wrap = h('div', { class:'inrow', style:'flex:1;margin:0' }, inp, sv);
        rs.replaceWith(wrap); inp.focus();
      } });
      row.append(rs);
    }
    let armed = 0;
    const del = h('button', { class:'del', text:'刪除', onclick: () => {
      if (!armed){ armed = 1; del.textContent = '確定刪除'; del.classList.add('arm'); setTimeout(() => { armed = 0; del.textContent = '刪除'; del.classList.remove('arm'); }, 3000); return; }
      removeEvent(e.id); renderAll(); refresh();
    } });
    row.append(del);
    list.append(row);
  }
  return list;
}

/* ───────── 扣除 sheet（長按 600ms） ───────── */
function openDeduct(key){
  const kid = cur(); const bd = $('deductBd'); bd.textContent = '';
  $('deductSheet').setAttribute('aria-label', '扣除一顆');
  const n = netOf(kid.id);
  const d = parseKey(key); const isToday = key === TODAY;
  bd.append(h('h2', { text:`要扣掉 ${kid.name} 的一顆星星嗎？` + (isToday ? '' : `（${d.getMonth()+1} 月 ${d.getDate()} 日）`) }));
  const tipsBefore = TIPS.filter(t => t[0] === '扣之前');
  bd.append(h('p', { class:'sub', text: pick(tipsBefore)[1] }));
  if (eventsOf(kid.id).some(e => e.type === 'minus' && e.date === key)) bd.append(h('p', { class:'sub warn', text:`這天已經扣過一顆了。再扣之前，先想想 ${kid.name} 知不知道是哪件事。` }));
  if (n === 0){
    bd.append(h('p', { class:'sub', text:`${kid.name} 現在是 0 顆，沒有可以扣的星星。` }));
    bd.append(h('button', { class:'pbtn', text:'知道了', onclick: closeSheet }));
    /* 兌換紀錄的入口不能因為 0 顆就消失（要看紀錄、刪誤兌換都靠它） */
    bd.append(h('button', { class:'lnk', text:'🎁 看兌換紀錄', onclick: openRedeem, style:'margin:8px auto 0' }));
    openSheet('deductSheet'); return;
  }
  bd.append(h('div', { class:'sec', text:'原因（可以不填）' }));
  const picker = chipPicker(orderedPool(kid, true), { grey:true, placeholder:'發生了什麼事？' });
  bd.append(picker.el);
  const holdTx = h('span', { text:'按住不放才會扣' });
  const hold = h('button', { class:'hold' }, h('div', { class:'fill' }), holdTx);
  let timer = 0, pid = null, hintTimer = 0;
  /* 長按是「深思熟慮的摩擦」，不是手指靈巧度測驗：
     中途放棄時要說一句為什麼沒扣成，不能默默歸零讓人以為壞了 */
  const reset = showHint => {
    const wasHolding = !!timer;
    clearTimeout(timer); timer = 0; hold.classList.remove('holding'); pid = null;
    if (showHint && wasHolding){
      clearTimeout(hintTimer);
      holdTx.textContent = '要按住不放，默數一秒才會扣喔';
      hintTimer = setTimeout(() => { holdTx.textContent = '按住不放才會扣'; }, 1800);
    }
  };
  hold.addEventListener('pointerdown', e => {
    if (timer) return; pid = e.pointerId; hold.classList.add('holding');
    /* 抓住 pointer：滑鼠/觸控板才不會一出邊界 1px 就觸發 pointerleave，讓 28px 容差失效 */
    try { hold.setPointerCapture(e.pointerId); } catch (err) {}
    timer = setTimeout(() => {
      reset(false);
      const reason = picker.value();
      state.events.push({ id:newId(), kid:kid.id, type:'minus', date:key, ts:Date.now(), reason });
      rememberReason(kid, reason, true); save();
      closeSheet();
      deductFeedback(kid.id, key);
    }, 600);
  });
  ['pointerup','pointercancel','pointerleave'].forEach(t => hold.addEventListener(t, e => { if (pid !== null && e.pointerId === pid) reset(true); }));
  /* 觸控有隱含 pointer capture，滑出按鈕不會發 pointerleave，要自己判界。
     邊界向外放 28px 容差：會抖的手不該被判定成「放棄」。 */
  hold.addEventListener('pointermove', e => {
    if (pid === null || e.pointerId !== pid) return;
    const r = hold.getBoundingClientRect(), m = 28;
    if (e.clientX < r.left - m || e.clientX > r.right + m || e.clientY < r.top - m || e.clientY > r.bottom + m) reset(true);
  });
  hold.addEventListener('contextmenu', e => e.preventDefault());
  bd.append(hold);
  const foot = h('div', { style:'display:flex; justify-content:space-between; align-items:center' });
  foot.append(h('button', { class:'lnk', text:'🎁 用好棒換東西', style:'margin:0', onclick: openRedeem }));
  foot.append(h('button', { class:'lnk', text:'取消', style:'margin:0', onclick: closeSheet }));
  bd.append(foot);
  openSheet('deductSheet');
}

/* ───────── 兌換 ─────────
   換掉的是「總好棒」的可用數；蓋過的星星、月曆、慶祝都不會變。
   要不要用星星換東西由每個家庭自己決定——app 只把帳記清楚。 */
function openRedeem(){
  const kid = cur(); const bd = $('deductBd'); bd.textContent = '';
  $('deductSheet').setAttribute('aria-label', '用好棒換東西');   /* 借扣除的容器，但別讓 VoiceOver 把換禮物唸成扣星星 */
  const W = walletOf(kid.id);
  bd.append(h('h2', {}, avaFace(kid, 24), ' 用好棒換東西'));
  bd.append(h('p', { class:'sub', text:`${kid.name} 存下來的好棒有 ${W} 顆可以用。用掉之後，做到的事都還在——月曆上的星星、慶祝，一顆都不會少。` }));
  const item = h('input', { placeholder:'換什麼？例如：樂高小車', maxlength:'30', enterkeyhint:'next' });
  bd.append(h('div', { class:'inrow', style:'margin-top:4px' }, item));
  const cost = h('input', { type:'number', inputmode:'numeric', placeholder:'要用掉幾顆？', min:'1' });
  bd.append(h('div', { class:'inrow' }, cost));
  const quick = h('div', { class:'chips', style:'margin-top:10px' });
  for (const v of [10, 20, 30, 50, 100]) quick.append(h('button', { class:'chip', text:String(v), onclick: () => { cost.value = String(v); sync(); } }));
  bd.append(quick);
  /* 兌換是安靜的帳務動作：不加驚嘆號，興奮留給「做到了！」 */
  const go = h('button', { class:'pbtn', text:'換' });
  const sync = () => {
    const c = Math.trunc(Number(cost.value)) || 0;
    const okv = item.value.trim() && c >= 1 && c <= W && c <= 100000;
    go.disabled = !okv;
    go.style.opacity = okv ? '' : '.5';
    go.textContent = c >= 1 ? `換（用掉 ${c} 顆）` : '換';
    if (c > W) go.textContent = `還差 ${c - W} 顆（現在可以用 ${W} 顆）`;
  };
  item.addEventListener('input', sync); cost.addEventListener('input', sync); sync();
  go.onclick = () => {
    const c = Math.trunc(Number(cost.value)); const it = item.value.trim();
    if (!it || c < 1 || c > W) return;
    const ev = { id:newId(), kid:kid.id, type:'redeem', date:todayKey(), ts:Date.now(), reason:it, n:c };
    state.events.push(ev); save();
    closeSheet(); renderAll();
    SFX.tick();      /* 換東西只給一聲輕響：紙花與音樂留給做到的事 */
    toast(`🎁 換到了：${it}（用掉 ${c} 顆，星星都還在）`, { ms:6000, action:'復原', onAction: () => { if (removeEvent(ev.id)){ renderAll(); toast('已復原'); } } });
  };
  bd.append(go);
  /* 兌換紀錄 */
  const past = eventsOf(kid.id).filter(e => e.type === 'redeem').sort((a, b) => b.ts - a.ts);
  if (past.length){
    bd.append(h('div', { class:'sec', text:'換過的東西' }));
    const list = h('div', { class:'list' });
    for (const e of past){
      const d = parseKey(e.date);
      const row = h('div', { class:'row' });
      row.append(h('span', { class:'tm', text:`${d.getMonth()+1}/${d.getDate()}` }));
      row.append(h('span', { class:'ic', text:'🎁' }));
      row.append(h('span', { class:'rs', text:`${e.reason || '（沒寫品項）'} ・ 用掉 ${e.n} 顆` }));
      let armed = 0;
      const del = h('button', { class:'del', text:'刪除', onclick: () => {
        if (!armed){ armed = 1; del.textContent = '確定刪除'; del.classList.add('arm'); setTimeout(() => { armed = 0; del.textContent = '刪除'; del.classList.remove('arm'); }, 3000); return; }
        removeEvent(e.id); renderAll(); openRedeem();
      } });
      row.append(del);
      list.append(row);
    }
    bd.append(list);
  }
  bd.append(h('button', { class:'lnk', text:'關閉', onclick: closeSheet, style:'margin:8px auto 0' }));
  openSheet('deductSheet');
}
function deductFeedback(kidId, key){

/* ───────── 紀錄頁 ─────────
   一次只畫 40 天，其餘按「載入更早的」再補：
   累積兩三年之後一口氣建幾千列，iPhone 會整個卡住。 */
let recordsDays = 40;
let reasonEditKidId = null;      /* 設定頁「常用原因」目前在編輯哪個孩子 */
let settingsTab = 'kids';        /* 設定頁目前的次分頁 */
let lastSettingsTab = null;
let lastSnapCount = 0;           /* 快照清單上次的筆數：重繪時先佔位，版面不跳 */
function openRecords(keepPage){
  if (!keepPage) recordsDays = 40;
  const kid = cur(); const bd = $('recordsBd'); bd.textContent = '';
  const evs = eventsOf(kid.id).slice().sort((a, b) => b.date.localeCompare(a.date) || b.ts - a.ts);
  const plus = evs.filter(e => e.type==='plus').length, minus = evs.filter(e => e.type==='minus').length;
  bd.append(h('h2', {}, avaFace(kid, 26), ` ${kid.name} 的紀錄`));
  const redeems = evs.filter(e => e.type === 'redeem').length;
  /* 歷史統計的家：主畫面第二行只掛「總好棒可以換幾顆」，一共蓋過／扣過在這裡看 */
  bd.append(h('p', { class:'sub', text: evs.length ? `一共蓋過 ${plus} 顆${minus ? `，扣過 ${minus} 顆` : ''}${redeems ? `，換過 ${redeems} 次東西` : ''}，總好棒 ${walletOf(kid.id)} 顆可以換。點原因可以補寫或修改。` : `還沒有任何紀錄。今天找一件 ${kid.name} 做到的小事吧。` }));
  if (plus) bd.append(h('button', { class:'sbtn fill', style:'width:100%;margin-bottom:14px', text:`跟 ${kid.name} 一起看這週 ⭐`, onclick: openReview }));
  const groups = {};
  for (const e of evs){ (groups[e.date] = groups[e.date] || []).push(e); }
  const dates = Object.keys(groups);
  const shown = dates.slice(0, recordsDays);
  for (const date of shown){
    const d = parseKey(date);
    bd.append(h('div', { class:'dgrp', text:`${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日（${WD[d.getDay()]}）` }));
    bd.append(eventList(groups[date].sort((a, b) => a.ts - b.ts), () => openRecords(true)));
  }
  if (dates.length > shown.length){
    bd.append(h('button', { class:'sbtn', style:'width:100%;margin-top:16px',
      text:`載入更早的紀錄（還有 ${dates.length - shown.length} 天）`,
      onclick: () => { recordsDays += 60; openRecords(true); } }));
  }
  /* 做過的事：照時間排、放在最底——這面鏡子照的是家長自己注意到了什麼，
     不照次數排，免得變成行為排行榜 */
  if (plus){
    const byReason = new Map();
    for (const e of evs){
      if (e.type !== 'plus') continue;
      const r = e.reason || '';
      const v = byReason.get(r) || { n:0, last:0 };
      v.n++; v.last = Math.max(v.last, e.ts); byReason.set(r, v);
    }
    const noR = byReason.get('') || null; byReason.delete('');
    const rows = [...byReason.entries()].sort((a, b) => b[1].last - a[1].last).slice(0, 12);
    if (rows.length){
      bd.append(h('div', { class:'dgrp', style:'margin-top:24px', text:'做過的事（照時間排，不是排行榜）' }));
      bd.append(h('p', { class:'sub', text:'這份清單也照出你最常注意到什麼。' }));
      const box = h('div', { class:'chips' });
      const tag = t => h('span', { class:'chip', style:'display:inline-flex;align-items:center;pointer-events:none', text:t });
      for (const [r, v] of rows) box.append(tag(`${r} ×${v.n}`));
      if (noR) box.append(h('span', { class:'chip grey', style:'display:inline-flex;align-items:center;pointer-events:none', text:`沒寫原因 ×${noR.n}` }));
      bd.append(box);
    }
  }
  openSheet('recordsSheet');
}

/* ───────── 設定頁 ───────── */
function openSettings(){
  const bd = $('settingsBd');
  if (cloudOn() && cloudFrozen() && openSheetId !== 'settingsSheet') settingsTab = 'backup';   /* 雲端還在等你決定時，一打開就帶到備份分頁（但不鎖住其他分頁） */
  /* 重繪不要把人彈回頁首：點一下原因標籤、換個顏色都會整頁重建；換分頁才回到頂 */
  const st0 = (openSheetId === 'settingsSheet' && lastSettingsTab === settingsTab) ? bd.scrollTop : 0;
  lastSettingsTab = settingsTab;
  bd.textContent = '';
  bd.append(h('h2', { text:'設定' }));
  /* 次分頁：內容多了，一長條會捲到天荒地老 */
  const tb = h('div', { class:'stabs' });
  for (const [tid, label] of [['kids', '孩子'], ['reasons', '原因'], ['backup', '備份'], ['other', '其他']]){
    tb.append(h('button', { class:'stab' + (settingsTab === tid ? ' on' : ''), text:label, onclick: () => { settingsTab = tid; openSettings(); } }));
  }
  bd.append(tb);
  if (settingsTab === 'kids'){
  bd.append(h('div', { class:'sec', text:'孩子們（名字、頭像、顏色）' }));
  bd.append(h('p', { class:'sub', text:'頭像可以選貼圖，也可以用孩子的照片（照片會縮小存在這支手機與你的備份裡，不會傳到別的地方）。孩子頁面最少 1 個、最多 5 個。' }));
  for (const k of state.kids){
    const t = theme(k);
    const card = h('div', { class:'kcard' });
    const ava = h('div', { class:'ava', style:`--k-bg:${t.bg};--k-accent:${t.accent}` });
    const refreshAva = () => { ava.textContent = ''; if (k.photo) ava.append(h('img', { class:'face', src:k.photo, alt:'' })); else ava.append(k.emoji); };
    refreshAva();
    const inp = h('input', { value:k.name, maxlength:'12', placeholder:'名字', enterkeyhint:'done' });
    inp.addEventListener('input', () => { k.name = inp.value.trim().slice(0, 12) || k.name; save(); renderKids(); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') inp.blur(); });
    card.append(h('div', { class:'top' }, ava, inp));
    const emos = h('div', { class:'emos' });
    for (const e of EMOJIS) emos.append(h('button', { class: (e === k.emoji && !k.photo) ? 'on' : '', text:e, 'aria-label':'頭像 ' + e, onclick: () => {
      k.emoji = e; k.photo = null; save();
      refreshAva(); refreshPhotoRow();
      emos.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.textContent === e));
      renderKids();
    } }));
    card.append(emos);
    /* 照片頭像：裁成正方形縮到 96px，只存在這支手機與備份裡 */
    const pfile = h('input', { type:'file', accept:'image/*', class:'hide' });
    pfile.addEventListener('change', () => {
      const f = pfile.files[0];
      if (f) setPhoto(k, f, () => { refreshAva(); refreshPhotoRow(); emos.querySelectorAll('button').forEach(b => b.classList.remove('on')); });
      pfile.value = '';
    });
    const prow = h('div', { class:'btns', style:'margin-top:10px' });
    const refreshPhotoRow = () => {
      prow.textContent = '';
      prow.append(h('button', { class:'sbtn', style:'height:40px;font-size:14px', text: k.photo ? '換一張照片' : '用照片當頭像', onclick: () => pfile.click() }));
      if (k.photo) prow.append(h('button', { class:'sbtn', style:'height:40px;font-size:14px', text:'改回貼圖', onclick: () => { k.photo = null; save(); refreshAva(); refreshPhotoRow(); renderKids(); } }));
    };
    refreshPhotoRow();
    card.append(prow, pfile);
    /* 一次調整總好棒：把以前在別的地方累積的加進來（或修正記錯的數） */
    const adjIn = h('input', { type:'number', inputmode:'numeric', placeholder:'調整總好棒，例如 30 或 -5' });
    const adjBtn = h('button', { text:'調整', onclick: () => {
      const v = Math.trunc(Number(adjIn.value));
      if (!v){ toast('輸入要加減的數字，例如 30 或 -5', { ms:2500 }); return; }
      if (Math.abs(v) > 10000){ toast('一次最多調整 10000 顆', { ms:3000 }); return; }
      const Wv = walletOf(k.id);
      /* 調整只動總好棒：往下修只要別讓總好棒變負數就好（大數字跟它無關了） */

      const b = e.currentTarget; b.disabled = true; b.textContent = '同步中…';
      const ok = await syncCloud(true);      /* 親手按的才准強制覆蓋雲端 */
      toast(ok ? '已同步到雲端' : '同步失敗：' + (gist.lastError || '請稍後再試'), { ms:3500 });
      openSettings();
    } }));
    let armedCloud = 0;
    const pullBtn = h('button', { class:'sbtn', text:'從雲端拿回備份', onclick: async () => {
      try {
        const raw = await fetchCloudContent();
        if (!raw){ toast('雲端沒有讀到備份', { ms:3000 }); return; }
        const s = normalize(JSON.parse(raw));
        if (!armedCloud){
          armedCloud = 1; pullBtn.textContent = `雲端有 ${s.events.length} 筆，再按一次覆蓋本機`; pullBtn.classList.add('warn');
          setTimeout(() => { armedCloud = 0; pullBtn.textContent = '從雲端拿回備份'; pullBtn.classList.remove('warn'); }, 5000);
          return;
        }
        resetRuntime();
        pendingCloud = null;
        if (gist){ gist.pending = false; saveGist(); }   /* 拿雲端那份＝已經做了決定 */
        state = s; save(); applyTheme(); renderAll(); closeSheet();
        toast('已從雲端還原', { ms:3000 });
      } catch (e) { toast((e && e.message) || '讀取失敗', { ms:3500 }); }
    } });
    cbtns.append(pullBtn);
    cbtns.append(h('button', { class:'sbtn warn', text:'中斷連線', onclick: () => {
      gist = null; pendingCloud = null; saveGist();
      toast('已中斷，雲端那份備份還在你的 GitHub 裡', { ms:4000 }); openSettings();
    } }));
    bd.append(cbtns);
  }

  bd.append(h('div', { class:'sec', text:'匯出備份（帶得走的那一份）' }));
  const lb = state.settings.lastBackupAt ? new Date(state.settings.lastBackupAt) : null;
  const daysAgo = lb ? Math.floor((Date.now() - lb.getTime()) / 864e5) : null;
  if (daysAgo === null || daysAgo >= 14){
    bd.append(h('div', { class:'warncard', text: lb
      ? `已經 ${daysAgo} 天沒有匯出備份了。自動快照跟紀錄放在同一支手機，手機掉了或 app 被刪掉就都沒了 —— 花十秒傳一份出去吧。`
      : '還沒有匯出過備份。自動快照跟紀錄放在同一支手機，手機掉了或 app 被刪掉就都沒了 —— 花十秒傳一份出去吧。' }));
  }
  bd.append(h('p', { class:'sub', text:`${cloudOn() ? '除了上面你自己設定的雲端備份，資料不會傳到任何其他地方。' : '資料只存在這支手機的這個 app 裡，不會上傳到任何地方。'}換手機、清除網站資料、或把主畫面上的圖示刪掉，這支手機上的紀錄都會不見。${lb ? `上次匯出：${lb.getFullYear()}/${lb.getMonth()+1}/${lb.getDate()}（${daysAgo} 天前）` : ''}` }));
  const btns = h('div', { class:'btns' });
  const ta = h('textarea', { class:'bk hide' });
  const markBacked = () => { state.settings.lastBackupAt = new Date().toISOString(); save(); renderKids(); };
  btns.append(h('button', { class:'sbtn fill', text:'複製備份文字', onclick: async () => {
    const json = JSON.stringify(state);
    let ok = false;
    try { await navigator.clipboard.writeText(json); ok = true; } catch (e) {}
    if (ok){ markBacked(); toast('已複製，貼到備忘錄或傳給自己保存', { ms:3000 }); return; }
    /* 剪貼簿被擋掉時，把文字露出來讓使用者自己複製 —— 但這時候還沒真的備份，不能標記已備份 */
    ta.classList.remove('hide'); ta.value = json;
    ta.focus(); try { ta.setSelectionRange(0, ta.value.length); } catch (e) {}
    toast('請長按下方文字全選後複製', { ms:4000 });
  } }));
  /* iOS 主畫面 app 沒有下載管理器，<a download> 常常靜默失敗；
     分享表才是這裡唯一可靠的出口（存到「檔案」、AirDrop、或傳給自己）。 */
  btns.append(h('button', { class:'sbtn', text:'傳出備份檔', onclick: async () => {
    const json = JSON.stringify(state, null, 1);
    const name = `好棒印章-${todayKey()}.json`;
    try {
      const file = new File([json], name, { type:'application/json' });
      if (navigator.canShare && navigator.canShare({ files:[file] })){
        await navigator.share({ files:[file], title:'好棒印章備份' });
        markBacked(); toast('已傳出備份檔', { ms:2500 });
        return;
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return;                 /* 使用者自己取消，不算失敗也不算備份 */
    }
    const url = URL.createObjectURL(new Blob([json], { type:'application/json' }));
    const a = h('a', { href:url, download:name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    /* 這條路不保證真的存到檔案，所以改用問的，家長確認了才算備份過 */
    toast('檔案有存下來嗎？', { ms:8000, action:'有存到', onAction: () => { markBacked(); toast('好，下次提醒會從今天算起', { ms:2000 }); } });
  } }));
  bd.append(btns, ta);

  bd.append(h('div', { class:'sec', text:'還原（會覆蓋目前全部資料）' }));
  const rta = h('textarea', { class:'bk', placeholder:'把備份文字貼在這裡，或用下面的按鈕選備份檔' });
  const preview = h('p', { class:'sub hide' });
  const file = h('input', { type:'file', accept:'.json,application/json', class:'hide' });
  let pending = null, armed = 0;
  const confirmBtn = h('button', { class:'sbtn warn', text:'確定覆蓋目前資料', disabled:true, onclick: () => {
    if (!pending) return;
    if (!armed){ armed = 1; confirmBtn.textContent = '再按一次就覆蓋'; confirmBtn.classList.add('fill'); setTimeout(() => { armed = 0; confirmBtn.textContent = '確定覆蓋目前資料'; confirmBtn.classList.remove('fill'); }, 3000); return; }
    resetRuntime();
    state = normalize(pending); save(); applyTheme(); renderAll(); closeSheet(); toast('已還原備份');
  } });
  function check(text){
    pending = null; confirmBtn.disabled = true; preview.classList.remove('hide');
    try {
      const raw = JSON.parse(text); const s = normalize(raw);
      if (!raw || !Array.isArray(raw.kids) || !Array.isArray(raw.events)) throw new Error('format');
      const lastDate = s.events.map(e => e.date).sort().pop();
      preview.textContent = `看起來是好棒印章的備份：${s.kids.map(k => k.name).join('、')}，共 ${s.events.length} 筆紀錄${lastDate ? `，最後一筆 ${lastDate}` : ''}。${cloudOn() ? '還原之後，雲端備份也會跟著變成這一份。' : ''}`;
      pending = raw; confirmBtn.disabled = false;
    } catch (e) { preview.textContent = '這段文字不是好棒印章的備份格式。'; }
  }
  rta.addEventListener('input', () => { if (rta.value.trim()) check(rta.value.trim()); else { preview.classList.add('hide'); pending = null; confirmBtn.disabled = true; } });
  file.addEventListener('change', () => { const f = file.files[0]; if (!f) return; f.text().then(t => { rta.value = t; check(t); }); });
  bd.append(rta, h('div', { class:'btns' }, h('button', { class:'sbtn', text:'選備份檔', onclick: () => file.click() }), confirmBtn), preview, file);

  }
  if (settingsTab === 'other'){
  bd.append(h('div', { class:'sec', text:'使用說明書' }));
  bd.append(h('p', { class:'sub' }, '怎麼蓋、怎麼備份、給阿公阿嬤的三句話，都在 ', h('a', { href:'manual.html', target:'_blank', style:'color:var(--accent-dark);font-weight:700', text:'使用說明書' }), ' 裡（可以印出來貼冰箱）。'));

  bd.append(h('div', { class:'sec', text:'裝到 iPhone 主畫面' }));
  bd.append(h('div', { class:'help' }, h('ol', {}, h('li', { text:'用 Safari 打開這個網址' }), h('li', {}, '點下方的 ', h('b', { text:'分享' }), ' 按鈕（方框加向上箭頭）'), h('li', {}, '選 ', h('b', { text:'加入主畫面' }), ' → 右上角「新增」')),
    h('p', { class:'sub', text:'之後從主畫面圖示打開，會像 app 一樣全螢幕，沒網路也能用。' }),
    h('p', { class:'sub', text:'注意兩件事：Safari 分頁跟主畫面 app 的資料是分開存的，先加到主畫面再開始蓋章；還有，只在 Safari 分頁裡用的話，一個禮拜沒打開 iPhone 可能會自動清掉，裝到主畫面才會長期保留。' })));
  bd.append(h('p', { class:'sub', style:'margin-top:16px', text: cloudOn() ? '好棒印章 v1 ・ 資料只去你自己的 GitHub 備份，不去任何其他地方。' : '好棒印章 v1 ・ 資料不會離開你的手機。' }));
  bd.append(h('p', { class:'sub', style:'margin-top:6px;text-align:center' }, '© 2026 ',
    h('a', { href:'https://www.facebook.com/profile.php?id=100084000897269', target:'_blank', rel:'noopener',
      style:'color:var(--accent-dark);font-weight:700;text-decoration:none', text:'指數三寶飯' }), ' ・ 版權所有'));
  }
  openSheet('settingsSheet');
  bd.scrollTop = st0;
}

/* ───────── 鍵盤 ─────────
   iOS 的鍵盤不會把版面推上去，只會縮小可視範圍，
   所以貼在底部的面板與 sheet 會躲到鍵盤後面。用 visualViewport 自己把它們頂起來。 */
(() => {
  const vv = window.visualViewport;
  if (!vv) return;
  const apply = () => {
    const lift = Math.max(0, Math.round(innerHeight - vv.height - vv.offsetTop));
    document.documentElement.style.setProperty('--kb', (lift > 60 ? lift : 0) + 'px');
  };
  vv.addEventListener('resize', apply);
  vv.addEventListener('scroll', apply);
  apply();
})();

/* ───────── 非主畫面模式的提示 ───────── */
(() => {
  const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  $('ihClose').onclick = () => { $('installHint').classList.remove('on'); state.settings.hintDismissed = true; save(); };
  window.__showInstallHint = () => { if (ios && !standalone && !state.settings.hintDismissed) $('installHint').classList.add('on'); };
})();

/* ───────── Service Worker：離線 + 新版提示 ───────── */
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)){
  addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
    navigator.serviceWorker.addEventListener('message', e => {
      if (e.data && e.data.type === 'shell-updated') toast('有新版本', { ms:8000, action:'更新', onAction: () => location.reload() });
    });
  });
}

/* ───────── 跨日就重畫 ─────────
   回到前景時檢查一次；app 一直開著（例如放在桌上充電）不會有 visibilitychange，
   所以再加一個每分鐘的輕量檢查，午夜過後月曆才會把「今天」移到新的一格。 */
document.addEventListener('visibilitychange', () => { if (!document.hidden && todayKey() !== TODAY) renderAll(); });
setInterval(() => { if (!document.hidden && todayKey() !== TODAY) renderAll(); }, 60000);

/* ───────── 啟動 ───────── */
load(); loadGist(); applyTheme(); renderAll(); nextTip(); window.__showInstallHint();
if (cloudOn()) scheduleCloudSync();      /* 開 app 也排一次，把上次沒傳成的補上 */

/* 開 app 時提醒備份，但一天最多講一次，不要變成另一種嘮叨 */
setTimeout(() => {
  if (!backupOverdue()) return;
  let nag = null;
  try { nag = localStorage.getItem(KEY + '.nag'); } catch (e) {}
  if (nag === todayKey()) return;
  try { localStorage.setItem(KEY + '.nag', todayKey()); } catch (e) {}
  toast('好久沒把備份帶出這支手機了', { ms:9000, action:'去備份', onAction: openSettings });
}, 2500);
</script>
</body>
</html>

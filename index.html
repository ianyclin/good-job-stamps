<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<!-- 不加 maximum-scale：看不清楚的人要能兩指放大 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>好棒印章</title>
<meta name="description" content="三個孩子各一本集章簿：做到一件具體的好事，就在月曆上蓋一個「你好棒！」。">
<meta name="theme-color" id="themeColor" content="#E4F2FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="好棒印章">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
/* ───────── 主題變數：切換孩子時由 JS 一次改在 :root ───────── */
:root{
  --bg:#E4F2FF; --card:#FFFFFF; --accent:#4FB8FF; --accent-dark:#1C6FD1; --ink:#0F2E52;
  --ink-rgb:15,46,82; --accent-rgb:79,184,255;
  --gold:#F5C542; --gold-dark:#C98A1B; --gold-line:#E2B14A;
  --grey:#6B6B6B; --grey-bg:#ECECEC; --grey-badge:#6B6B6B; --dim:#6B6B6B;
  --font: ui-rounded, -apple-system, "PingFang TC", "Noto Sans TC", "Helvetica Neue", sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font);
  transition:background-color .25s ease; overflow:hidden;
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;
  touch-action:manipulation;
}
input,textarea{-webkit-user-select:text;user-select:text;font-family:var(--font)}
button{font-family:var(--font);color:inherit;cursor:pointer;-webkit-touch-callout:none}
button:disabled{cursor:default}
svg{display:block}

#app{
  height:100vh; height:100dvh; display:flex; flex-direction:column;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  overflow-y:auto; overflow-x:hidden;
}

/* ───────── 1. 孩子切換列 ───────── */
.kids{flex:0 0 84px; display:flex; align-items:center; padding:0 6px 0 16px}
.kid{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  background:none; border:0; padding:4px 0; position:relative; min-height:44px;
}
.kid .ava{
  width:54px; height:54px; border-radius:50%; background:var(--card);
  border:2px solid var(--k-accent); font-size:30px; line-height:1;
  display:grid; place-items:center; position:relative;
  transition:transform .2s ease, border-color .2s ease, border-width .2s ease;
}
.kid.on .ava{transform:scale(1.12); border:3px solid var(--k-dark)}
.kid.bounce .ava{animation:kidBounce .22s ease-out}
@keyframes kidBounce{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(1.12)}}
.kid .nm{font-size:14px; max-width:104px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.kid.on .nm{font-weight:700}
.kid .bar{width:24px; height:4px; border-radius:2px; background:var(--accent-dark); opacity:0; transition:opacity .2s}
.kid.on .bar{opacity:1}
/* 四、五個孩子時縮小頭像 */
.kids.n4 .ava{width:48px; height:48px; font-size:26px}
.kids.n4 .nm{max-width:78px}
.kids.n4 .nd{right:calc(50% - 27px)}
.kids.n5 .ava{width:42px; height:42px; font-size:23px}
.kids.n5 .nm{font-size:12px; max-width:62px}
.kids.n5 .nd{right:calc(50% - 24px)}
/* 設定頁次分頁 */
.stabs{display:flex; gap:6px; margin:2px 0 14px; position:sticky; top:0; background:var(--card); padding:6px 0; z-index:3}
.stab{flex:1; height:40px; border-radius:12px; border:1.5px solid rgba(0,0,0,.14); background:none; color:var(--ink); font-size:15px; font-weight:700}
.stab.on{background:var(--accent-dark); border-color:var(--accent-dark); color:#fff}
/* 今天還沒蓋章：右上角一個灰點（不是紅點） */
.kid .nd{position:absolute; width:8px; height:8px; border-radius:50%; background:#B0B0B0; top:4px; right:calc(50% - 30px); display:none}
.kid.nodot .nd{display:block}
.gear{width:44px; height:44px; border:0; background:none; display:grid; place-items:center; color:rgba(var(--ink-rgb),.55); position:relative}
.gear svg{width:26px; height:26px}
.gear .bd{position:absolute; top:8px; right:8px; width:6px; height:6px; border-radius:50%; background:#B0B0B0; display:none}
.gear.stale .bd{display:block}

/* ───────── 2. 星星總數區 ───────── */
.hero{flex:1 0 96px; max-height:150px; display:flex; flex-direction:column; align-items:center; justify-content:center; background:none; border:0; width:100%; padding:0}
.hero-row{display:flex; align-items:center; gap:14px}
.hero-star{width:36px; height:36px}
.hero-num{font-size:56px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; letter-spacing:-1px}
.dots{display:grid; grid-template-columns:repeat(5,8px); gap:4px}
.dots i{width:8px; height:8px; border-radius:50%; border:1.5px solid var(--accent-dark); display:block; transition:background-color .2s}
.dots i.on{background:var(--accent); border-color:var(--accent)}
.hero-sub{font-size:14px; color:rgba(var(--ink-rgb),.78); margin-top:6px; max-width:94vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
/* 第二行：總好棒現在可以換幾顆（歷史累計退到紀錄頁看） */
.hero-total{font-size:13px; color:rgba(var(--ink-rgb),.62); margin-top:3px; max-width:94vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.hero-total b{font-weight:800; color:var(--accent-dark); font-size:14px}

/* ───────── 3. 月曆 ───────── */
/* 不可壓縮：螢幕不夠高時整頁改用捲動（#app overflow-y:auto），月曆最後一排不能被裁掉 */
.cal{flex:2 0 auto; padding:0 16px; display:flex; flex-direction:column; justify-content:center; position:relative}
.cal-head{height:44px; display:flex; align-items:center; justify-content:space-between; position:relative}
.cal-head button{height:44px; border:0; background:none; font-size:26px; color:var(--accent-dark); padding:0; line-height:1}
.cal-head .nav{width:44px}
.cal-head .cal-title{font-size:18px; font-weight:700; color:var(--ink); flex:1}
.wk{display:grid; grid-template-columns:repeat(7,1fr); font-size:13px; color:var(--dim); text-align:center; height:20px; align-items:center}
.grid-wrap{overflow:hidden}
/* pan-y 之外要留 pinch-zoom：老花讀者靠兩指放大，月曆正是最需要放大的地方 */
.grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; touch-action:pan-y pinch-zoom}
.grid.slide-l{animation:slideL .2s ease-out}
.grid.slide-r{animation:slideR .2s ease-out}
@keyframes slideL{from{transform:translateX(40px);opacity:.3}to{transform:none;opacity:1}}
@keyframes slideR{from{transform:translateX(-40px);opacity:.3}to{transform:none;opacity:1}}
.cell{
  aspect-ratio:1/1; border-radius:12px; border:0; padding:0; position:relative;
  background:var(--card); box-shadow:inset 0 0 0 100px rgba(0,0,0,.02); overflow:hidden;
}
.cell.has{box-shadow:0 1px 2px rgba(0,0,0,.06)}
.cell.today{box-shadow:inset 0 0 0 2px var(--accent-dark)}
.cell.gold{box-shadow:inset 0 0 0 2px var(--gold-line)}
.cell.today.gold{box-shadow:inset 0 0 0 2px var(--accent-dark), inset 0 0 0 4px var(--gold-line)}
.cell.future{opacity:.35; box-shadow:none}
.cell.blank{visibility:hidden}
.cell.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
/* 最小字級全域抬高一級：老花讀者不用開任何設定就看得到 */
.cell .d{position:absolute; top:4px; left:5px; font-size:13px; color:rgba(var(--ink-rgb),.72); line-height:1}
.cell.today .d{color:var(--ink); font-weight:800}
.cell svg.s{position:absolute; transform:translate(-50%,-50%) rotate(var(--r,0deg)); --s-fill:var(--accent); --s-stroke:var(--accent-dark)}
.cell svg.s.pop{animation:starPop .15s ease-out}
@keyframes starPop{0%{transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(0)}60%{transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(1.3)}100%{transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(1)}}
.cell svg.o{position:absolute; left:50%; top:56%; width:20px; height:20px; transform:translate(-50%,-50%); opacity:.25}
.cell .x{
  position:absolute; left:78%; top:78%; transform:translate(-50%,-50%);
  width:18px; height:18px; border-radius:50%; background:var(--accent-dark); color:#fff;
  font-size:10px; font-weight:800; display:grid; place-items:center; line-height:1;
}
.cell .m{
  position:absolute; top:3px; right:3px; width:16px; height:16px; border-radius:50%;
  background:var(--grey-badge); color:#fff; font-size:10px; font-weight:700; display:grid; place-items:center; line-height:1;
}
.cell .m.fade{animation:fadeIn .3s}
.cell .g{position:absolute; top:2px; right:3px; width:12px; height:12px; --s-fill:var(--gold); --s-stroke:var(--gold-dark)}
.cell .g.withm{right:21px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.cell.flash{animation:cellFlash .2s}
@keyframes cellFlash{0%{background:rgba(var(--accent-rgb),.3)}100%{background:var(--card)}}

/* ───────── 4. 主操作列 ───────── */
.actions{flex:0 0 96px; display:flex; align-items:center; gap:12px; padding:0 16px}
.rbtn{width:52px; height:52px; border-radius:50%; background:var(--grey-bg); color:var(--grey); font-size:26px; border:0; display:grid; place-items:center; line-height:1; flex:0 0 52px; transition:opacity .2s}
.rbtn.dim{opacity:.4}
.rbtn:active{transform:scale(.94)}
.big{
  flex:1; height:72px; border-radius:36px; background:var(--accent-dark); color:#fff;
  font-size:22px; font-weight:800; border:0; display:flex; align-items:center; justify-content:center; gap:8px;
  box-shadow:0 6px 16px rgba(var(--accent-rgb),.4); transition:transform .08s, background-color .25s;
}
.big:active{transform:scale(.94)}
.big svg{width:24px; height:24px; --s-fill:#fff; --s-stroke:rgba(0,0,0,.12)}

/* ───────── 5. 家長小語 ───────── */
.tip{flex:0 0 auto; min-height:52px; display:flex; align-items:center; gap:8px; padding:4px 16px 6px; font-size:14px; line-height:1.4; color:rgba(var(--ink-rgb),.82); background:none; border:0; width:100%; text-align:left}
.tip svg{width:16px; height:16px; flex:0 0 16px; color:var(--accent-dark)}
/* 膠囊字很小，用深色文字而不是主題色，淺色主題下才讀得清楚 */
.tip .pill{font-size:11px; padding:3px 8px; border-radius:10px; background:rgba(var(--accent-rgb),.3); color:var(--ink); white-space:nowrap; flex:0 0 auto; font-weight:700}
.tip .tx{flex:1; transition:opacity .15s}
.tip.fade .tx{opacity:0}

/* ───────── 蓋章動畫覆蓋層 ───────── */
/* 粒子畫布要在慶祝遮罩「之上」，不然滿 100 的煙火全被蓋住看不到 */
#fx{position:fixed; inset:0; pointer-events:none; z-index:76}
#stampLayer{position:fixed; inset:0; pointer-events:none; z-index:55; display:none}
#stampLayer.on{display:block}
.stamp{
  position:fixed; left:0; top:0; width:140px; height:140px; border-radius:50%;
  background:var(--accent); opacity:0; will-change:transform;
  box-shadow:0 10px 30px rgba(0,0,0,.18);
}
.stamp::before{content:""; position:absolute; inset:7px; border-radius:50%; border:2px dashed rgba(255,255,255,.9)}
.stamp svg{position:absolute; left:50%; top:50%; width:84px; height:84px; transform:translate(-50%,-50%); --s-fill:#fff; --s-stroke:var(--accent-dark); --s-sw:1.2}
.stamp.goldish{background:var(--gold)}
.stamp.goldish svg{--s-stroke:var(--gold-dark)}
.flash{position:fixed; left:0; top:0; width:200px; height:200px; border-radius:50%; background:radial-gradient(circle, var(--accent) 0%, rgba(var(--accent-rgb),.35) 45%, transparent 70%); opacity:0; will-change:transform}
#stampTxt{position:fixed; left:0; top:0; transform:translate(-50%,0); font-size:36px; font-weight:900; white-space:nowrap; opacity:0; will-change:transform; line-height:1.2}
#stampTxt .st{position:absolute; left:0; top:0; -webkit-text-stroke:7px #fff; color:#fff}
#stampTxt .ft{position:relative; color:var(--accent-dark)}

/* ───────── 小慶祝：緞帶橫幅 ───────── */
#banner{position:fixed; top:0; left:0; right:0; z-index:77; padding-top:env(safe-area-inset-top); transform:translateY(-120%); pointer-events:none; will-change:transform}
#banner .rb{
  margin:10px 20px 0; background:var(--accent-dark); color:#fff; text-align:center; padding:14px 28px;
  clip-path:polygon(0 0,100% 0,calc(100% - 12px) 50%,100% 100%,0 100%,12px 50%);
  box-shadow:0 8px 24px rgba(0,0,0,.18);
}
#banner .t1{font-size:20px; font-weight:800}
#banner .t2{font-size:14px; opacity:.92; margin-top:4px}

/* ───────── 大慶祝：滿 100 ───────── */
#big{
  position:fixed; inset:0; background:rgba(20,20,40,.88); z-index:75; display:none;
  flex-direction:column; align-items:center; justify-content:center; color:#fff; text-align:center;
  padding:calc(env(safe-area-inset-top) + 16px) 24px calc(env(safe-area-inset-bottom) + 24px); opacity:0; transition:opacity .3s;
}
#big.on{display:flex}
#big .who{position:absolute; top:calc(env(safe-area-inset-top) + 14px); left:0; right:0; font-size:14px; opacity:.7}
#big .bigstar{width:140px; height:140px; --s-fill:var(--gold); --s-stroke:var(--gold-dark); --s-sw:.6; opacity:0; will-change:transform; position:relative}
#big .halo{position:absolute; width:300px; height:300px; border-radius:50%; background:radial-gradient(circle, rgba(245,197,66,.55) 0%, rgba(245,197,66,0) 70%); opacity:0; will-change:transform}
#big .h1{font-size:44px; font-weight:900; margin-top:18px; opacity:0}
#big .h2{font-size:18px; opacity:0; margin-top:8px; line-height:1.5}
#big .take{
  margin-top:32px; height:72px; padding:0 40px; border-radius:36px; background:var(--gold); color:#4A2E12;
  font-size:20px; font-weight:800; border:0; opacity:0; pointer-events:none; box-shadow:0 8px 24px rgba(0,0,0,.3);
}
#big .take.on{opacity:1; pointer-events:auto}
#big .take:active{transform:scale(.95)}
#big .skip{position:absolute; top:calc(env(safe-area-inset-top) + 8px); right:8px; background:none; border:0; color:#fff; opacity:0; font-size:13px; padding:12px; pointer-events:none; transition:opacity .3s}
#big .skip.on{opacity:.7; pointer-events:auto}

/* ───────── 原因面板（蓋完章後從底部滑入） ───────── */
/* 原因面板刻意停在操作列「上方」：家長想連蓋第二顆時，大按鈕永遠是露出來的 */
#reasonPanel{
  position:fixed; left:0; right:0; bottom:calc(148px + env(safe-area-inset-bottom) + var(--kb, 0px)); background:var(--card); border-radius:20px 20px 0 0;
  box-shadow:0 -6px 24px rgba(0,0,0,.14);
  /* 收起時要退到「自己的高度 + 底下操作列」之外，不然會露一截在畫面上 */
  transform:translateY(calc(100% + 200px)); transition:transform .24s cubic-bezier(.2,.8,.2,1);
  z-index:65; padding:10px 16px 12px; will-change:transform; visibility:hidden;
}
#reasonPanel.on{transform:none; visibility:visible}
#reasonPanel .ttl{font-size:14px; color:var(--dim); display:flex; justify-content:space-between; align-items:center; margin-bottom:8px}

/* ───────── 共用：chips、toast、sheet ───────── */
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chips.row{flex-wrap:nowrap; overflow-x:auto; padding-bottom:6px; margin:0 -16px; padding-left:16px; padding-right:16px; -webkit-overflow-scrolling:touch; scrollbar-width:none}
.chips.row::-webkit-scrollbar{display:none}
/* 原因列右端的「⌄」：展開成多行方便看，再按收回一行；偏好會記住 */
.chiprow{display:flex; align-items:flex-start}
.chiprow .chips.row{flex:1; min-width:0; margin-right:0; padding-right:4px}
.chiprow .chips.row.wrap{flex-wrap:wrap; overflow-x:visible; overflow-y:auto; overscroll-behavior:contain;
  /* 展開不能無上限長高：原因一多會把面板頂端（含「其他…」與收合鈕）頂出螢幕外，變成點不到 */
  max-height:max(96px, calc(100vh - var(--kb, 0px) - 380px));
  max-height:max(96px, calc(100dvh - var(--kb, 0px) - 380px))}
.chevx{flex:0 0 34px; width:34px; height:44px; border:0; background:none; color:var(--dim); font-size:20px; padding:0; transition:transform .2s}
.chevx.up{transform:rotate(180deg)}
.chip{height:44px; padding:0 14px; border-radius:22px; border:1.5px solid var(--accent-dark); background:none; color:var(--ink); font-size:16px; white-space:nowrap; flex:0 0 auto; transition:background-color .12s, color .12s}
.chip.on{background:var(--accent-dark); color:#fff}
.chip.grey{border-color:var(--grey)}
.chip.grey.on{background:var(--grey); border-color:var(--grey); color:#fff}
.inrow{display:flex; gap:8px; margin-top:10px}
.inrow input{flex:1; height:44px; border-radius:12px; border:1.5px solid #ddd; padding:0 12px; font-size:16px; background:#fff; color:var(--ink); min-width:0}
.inrow input:focus{outline:none; border-color:var(--accent-dark)}
.inrow button{height:44px; padding:0 16px; border-radius:12px; border:0; background:var(--accent-dark); color:#fff; font-size:16px; font-weight:700}
.hide{display:none !important}

#toast{
  position:fixed; left:16px; right:16px; bottom:calc(156px + env(safe-area-inset-bottom) + var(--kb, 0px)); background:#3A3A3A; color:#fff;
  border-radius:14px; padding:10px 8px 10px 14px; font-size:14px; line-height:1.4; display:flex; align-items:center; gap:8px;
  opacity:0; transform:translateY(10px); transition:.2s; z-index:80; pointer-events:none; box-shadow:0 6px 20px rgba(0,0,0,.25);
}
:root{--kb:0px}
#toast.on{opacity:1; transform:none}
#toast span{flex:1; pointer-events:none}
#toast button{margin-left:auto; background:none; border:1.5px solid rgba(255,211,107,.75); border-radius:12px; color:#FFD36B; font-weight:700; font-size:16px; min-height:44px; min-width:64px; padding:0 12px; white-space:nowrap; pointer-events:auto}
/* 原因面板開著時，toast 改貼畫面頂端——面板會長高（還有誰也做了），別去猜它的高度 */
#reasonPanel.on ~ #toast{bottom:auto; top:calc(env(safe-area-inset-top) + 8px)}

.scrim{position:fixed; inset:0; background:rgba(0,0,0,.28); opacity:0; pointer-events:none; transition:opacity .2s; z-index:70}
.scrim.on{opacity:1; pointer-events:auto}
.sheet{
  position:fixed; left:0; right:0; bottom:var(--kb, 0px); background:var(--card); border-radius:20px 20px 0 0;
  transform:translateY(100%); transition:transform .24s cubic-bezier(.2,.8,.2,1); z-index:71;
  max-height:88vh; max-height:calc(88dvh - var(--kb, 0px)); display:flex; flex-direction:column; padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -6px 30px rgba(0,0,0,.15); will-change:transform;
}
.sheet.open{transform:none}
.sheet.drag{transition:none}
.sheet .hd{height:36px; display:grid; place-items:center; flex:0 0 36px; touch-action:none; position:relative}
.sheet .hd i{width:36px; height:4px; border-radius:2px; background:#ddd}
.sheet .bd{overflow-y:auto; padding:4px 16px 20px; -webkit-overflow-scrolling:touch}
.sheet h2{font-size:18px; font-weight:700; margin:4px 0 4px}
.sheet .sub{font-size:14px; color:rgba(var(--ink-rgb),.82); line-height:1.55; margin:0 0 12px}
.sheet .sub.warn{color:var(--dim)}
.sheet .sec{font-size:13px; color:var(--dim); margin:16px 0 8px}
.pbtn{width:100%; height:64px; border-radius:18px; border:0; background:var(--accent-dark); color:#fff; font-size:20px; font-weight:800; margin-top:16px; display:flex; align-items:center; justify-content:center; gap:8px}
.pbtn svg{width:24px; height:24px; --s-fill:#fff; --s-stroke:rgba(0,0,0,.12)}
.pbtn:active{transform:scale(.97)}
.lnk{background:none; border:0; color:var(--dim); font-size:14px; min-height:44px; padding:0 4px; display:block; margin:6px 0 0 auto}
.list{display:flex; flex-direction:column}
.row{display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid rgba(0,0,0,.06); min-height:52px}
.row .tm{font-size:13px; color:var(--dim); flex:0 0 44px}
.row .ic{flex:0 0 22px; height:22px; display:grid; place-items:center}
.row .ic svg{width:20px; height:20px; --s-fill:var(--accent); --s-stroke:var(--accent-dark)}
.row .ic.m{color:var(--grey); font-size:18px; font-weight:700}
.row .ic.g svg{--s-fill:var(--gold); --s-stroke:var(--gold-dark)}
.row .rs{flex:1; font-size:15px; background:none; border:0; text-align:left; padding:6px 0; color:var(--ink); min-height:44px}
.row .rs.empty{color:#767676}
.row .del{background:none; border:0; color:var(--dim); font-size:14px; min-height:44px; min-width:52px; padding:0 0 0 8px; white-space:nowrap}
.row .del.arm{color:#C0392B; font-weight:700}
.empty-note{font-size:14px; color:#767676; padding:14px 0}
.dgrp{font-size:13px; color:var(--dim); margin:14px 0 2px; font-weight:700}

/* 長按扣除鈕 */
.hold{
  width:100%; height:64px; border-radius:16px; border:0; background:var(--grey); color:#fff; font-size:18px; font-weight:700;
  position:relative; overflow:hidden; margin-top:16px; touch-action:none;
}
.hold .fill{position:absolute; left:0; top:0; bottom:0; width:0; background:#4A4A4A; transition:width .12s}
.hold.holding .fill{transition:width .6s linear; width:100%}
.hold span{position:relative}
.hold:disabled{opacity:.5}

/* 設定頁 */
.kcard{border:1.5px solid rgba(0,0,0,.08); border-radius:16px; padding:12px; margin-bottom:12px}
.kcard .top{display:flex; align-items:center; gap:10px}
.kcard .top .ava{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; font-size:26px; background:var(--k-bg); border:2px solid var(--k-accent); flex:0 0 44px}
.kcard input{flex:1; height:44px; border-radius:12px; border:1.5px solid #ddd; padding:0 12px; font-size:16px; min-width:0; background:#fff; color:var(--ink)}
.kcard input:focus{outline:none; border-color:var(--accent-dark)}
.emos{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.emos button{width:44px; height:44px; border-radius:12px; border:1.5px solid transparent; background:rgba(0,0,0,.04); font-size:24px; padding:0}
.emos button.on{border-color:var(--accent-dark); background:rgba(var(--accent-rgb),.15)}
.swname{font-size:12px; color:var(--dim); margin-top:10px}
.sw{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px}
.sw .swatch{width:44px; height:44px; border-radius:50%; border:2px solid transparent; background:var(--t-bg); padding:0; display:grid; place-items:center; position:relative}
.sw .swatch i{width:22px; height:22px; border-radius:50%; background:var(--t-accent); box-shadow:inset 0 -6px 0 var(--t-dark); display:block}
.sw .swatch.on{border-color:var(--t-dark)}
.sw .swatch.on::after{content:"✓"; position:absolute; right:-1px; bottom:-1px; width:18px; height:18px; border-radius:50%; background:var(--t-dark); color:#fff; font-size:11px; font-weight:800; display:grid; place-items:center; line-height:1}
/* 常用原因的可增刪標籤：≡ 拖動排序、× 收起或刪掉 */
.rlist{display:flex; flex-wrap:wrap; gap:8px}
.rtag{display:inline-flex; align-items:center; gap:4px; min-height:44px; padding:0 5px 0 8px; border-radius:22px; border:1.5px solid var(--accent-dark); background:var(--card); color:var(--ink); font-size:15px}
.rtag .grab{font-style:normal; font-size:17px; color:var(--dim); padding:0 4px; cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; align-self:stretch; display:grid; place-items:center}
.rtag.drag{opacity:.55; border-style:dashed}
.rtag .rx{font-size:16px; color:var(--dim); width:34px; height:34px; display:grid; place-items:center; border-radius:50%; background:rgba(0,0,0,.06); border:0; padding:0; flex:0 0 34px}
.rtag.mine{border-style:dashed}
.rtag.off{border-color:#D0D0D0; color:#9A9A9A; text-decoration:line-through; padding-left:14px}
.rtag.off .rx{color:var(--accent-dark); background:rgba(var(--accent-rgb),.25); text-decoration:none}
.srow{display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid rgba(0,0,0,.06); font-size:15px}
.srow .note{font-size:13px; color:var(--dim); margin-top:3px; line-height:1.45}
.toggle{width:52px; height:32px; border-radius:16px; background:#B0B0B0; border:0; position:relative; flex:0 0 52px; transition:background-color .2s; padding:0}
.toggle::before{content:""; position:absolute; left:0; right:0; top:-6px; bottom:-6px}
.toggle::after{content:""; position:absolute; top:3px; left:3px; width:26px; height:26px; border-radius:50%; background:#fff; transition:transform .2s; box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle.on{background:var(--accent-dark)}
.toggle.on::after{transform:translateX(20px)}
.sbtn{height:48px; padding:0 16px; border-radius:12px; border:1.5px solid var(--accent-dark); background:none; color:var(--accent-dark); font-size:16px; font-weight:700}
.sbtn.fill{background:var(--accent-dark); color:#fff}
.sbtn.warn{border-color:#C0392B; color:#C0392B}
.sbtn.warn.fill{background:#C0392B; color:#fff}
.sbtn:disabled{opacity:.4}
.btns{display:flex; gap:10px; flex-wrap:wrap; margin-top:8px}
/* 字級一定要 16px：iOS 一碰到小於 16px 的輸入框就會自動放大整頁 */
textarea.bk{width:100%; height:110px; border-radius:12px; border:1.5px solid #ddd; padding:10px; font-size:16px; font-family:ui-monospace, Menlo, monospace; resize:none; margin-top:8px; background:#fff; color:var(--ink)}
.snaps{display:flex; flex-direction:column}
.snap{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid rgba(0,0,0,.06); font-size:15px}
.warncard{background:rgba(var(--accent-rgb),.22); border-left:4px solid var(--accent-dark); border-radius:10px; padding:12px 14px; font-size:14px; line-height:1.6; color:var(--ink); margin-bottom:12px}
.help{font-size:14px; line-height:1.7; color:rgba(var(--ink-rgb),.85)}
.help ol{padding-left:20px; margin:4px 0}
.help b{color:var(--accent-dark)}

/* 非主畫面模式的一次性提示：放在版面流裡（不是浮在上面），才不會蓋住家長小語與大按鈕 */
#installHint{display:none; flex:0 0 auto; padding:6px 12px 0}
#installHint.on{display:block}
#installHint .ih{background:#333; color:#fff; border-radius:14px; padding:10px 4px 10px 14px; font-size:13px; line-height:1.45; display:flex; align-items:center; gap:6px}
#installHint .ih span{flex:1}
#installHint .ih button{background:none; border:0; color:#fff; font-size:20px; width:44px; height:44px; padding:0; opacity:.85; flex:0 0 44px}

/* ───────── 這一批改善的新元件 ───────── */
.shx{position:absolute; right:6px; top:0; height:36px; min-width:64px; border:0; background:none; color:var(--dim); font-size:15px; font-weight:700; padding:0 10px}
.shx::before{content:""; position:absolute; inset:-6px -4px}   /* 命中區擴到 44pt，視覺不變 */
/* 錨在 cal-head 上（月曆內容是垂直置中的，錨在 .cal 會漂） */
.backNow{position:absolute; top:100%; margin-top:4px; left:50%; transform:translateX(-50%); z-index:5; height:36px; padding:0 16px; border-radius:18px; border:1.5px solid var(--accent-dark); background:var(--card); color:var(--accent-dark); font-size:14px; font-weight:700; box-shadow:0 3px 10px rgba(0,0,0,.14)}
.backNow::after{content:""; position:absolute; inset:-6px -8px}
img.face{border-radius:50%; object-fit:cover; display:inline-block; vertical-align:-5px}
.ava img.face{width:100%; height:100%; vertical-align:baseline}
.stamp .semo{position:absolute; left:50%; bottom:9px; transform:translateX(-50%); width:26px; height:26px; border-radius:50%; background-size:cover; background-position:center; font-size:22px; line-height:26px; text-align:center}
.seeRec{color:var(--accent-dark); font-weight:700}
/* 「還有誰也做了」固定單行：人多就左右滑，別把面板越撐越高 */
.sibs{display:flex; align-items:center; gap:8px; margin-top:10px; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; margin-left:-16px; margin-right:-16px; padding:0 16px 4px; font-size:15px; color:rgba(var(--ink-rgb),.8)}
.sibs::-webkit-scrollbar{display:none}
.sibs span{white-space:nowrap; flex:0 0 auto}
.sibs button{display:inline-flex; align-items:center; gap:4px; height:44px; padding:0 14px; border-radius:22px; border:1.5px solid var(--accent-dark); background:none; font-size:15px; color:var(--ink); white-space:nowrap; flex:0 0 auto}
.sibs button.done{background:var(--accent-dark); color:#fff; border-color:var(--accent-dark)}
/* 底部動作列：左＝先跳過／完成（明顯），右＝蓋錯了拿掉（刻意低調，離遠一點防誤按） */
.rpfoot{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:10px}
#rpSkip{height:44px; padding:0 20px; border-radius:22px; border:1.5px solid var(--accent-dark); background:none; color:var(--accent-dark); font-size:16px; font-weight:700; flex:0 0 auto}
#rpSkip.fill{background:var(--accent-dark); color:#fff}
#rpUndo{background:none; border:0; color:var(--dim); font-size:14px; min-height:44px; padding:0 4px; text-align:right}
/* 照片頭像的裁切調整層：圓圈預覽＋拖動＋縮放 */
#cropLay{position:fixed; inset:0; z-index:90; background:rgba(0,0,0,.74); display:none; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:20px}
#cropLay.on{display:flex}
.cropTtl{color:#fff; font-size:15px; text-align:center; line-height:1.55; text-shadow:0 1px 4px rgba(0,0,0,.4)}
.cropBox{width:min(76vw,280px); height:min(76vw,280px); border-radius:50%; overflow:hidden; position:relative; background:#111;
  box-shadow:0 0 0 3px rgba(255,255,255,.95), 0 12px 40px rgba(0,0,0,.5); touch-action:none; cursor:grab; flex:0 0 auto}
.cropBox img{position:absolute; left:0; top:0; transform-origin:0 0; max-width:none; pointer-events:none; -webkit-user-select:none; user-select:none}
.cropZoom{display:flex; align-items:center; gap:10px; width:min(76vw,280px); color:#fff; font-size:14px}
.cropZoom input{flex:1; min-height:44px; accent-color:var(--accent-dark)}
.cropBtns{display:flex; gap:12px}
.cropBtns button{height:48px; padding:0 22px; border-radius:24px; font-size:16px; font-weight:700; border:0}
#cropCancel{background:rgba(255,255,255,.18); color:#fff}
#cropOk{background:var(--accent-dark); color:#fff}
/* 滿 10：十顆星星逐顆點亮清點 */
#tenlay{position:fixed; inset:0; z-index:66; display:flex; align-items:center; justify-content:center; pointer-events:none; opacity:0; transition:opacity .2s}
#tenlay.on{opacity:1}
.tencard{background:var(--card); border-radius:22px; padding:20px 22px 16px; box-shadow:0 12px 44px rgba(0,0,0,.22); text-align:center; max-width:86vw}
.tenstars{display:grid; grid-template-columns:repeat(5,36px); gap:10px; justify-content:center}
.tenstars svg{width:36px; height:36px; opacity:.14}
.tenstars svg.lit{opacity:1}
.tenline{margin-top:12px; font-size:16px; font-weight:700; color:var(--accent-dark); min-height:45px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.tenstars svg, .rvrow svg{--s-fill:var(--accent); --s-stroke:var(--accent-dark)}
/* 睡前一起看（孩子視角，唯讀） */
#review{position:fixed; inset:0; z-index:74; background:var(--bg); display:none; flex-direction:column; padding:calc(env(safe-area-inset-top) + 12px) 22px calc(env(safe-area-inset-bottom) + 16px)}
#review.on{display:flex}
#review .shx{position:absolute; top:calc(env(safe-area-inset-top) + 10px); right:10px; height:44px}
.rvhead{font-size:24px; font-weight:900; margin:10px 60px 14px 0; line-height:1.35}
.rvlist{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; display:flex; flex-direction:column}
.rvrow{display:flex; align-items:center; gap:14px; padding:10px 2px; background:none; border:0; text-align:left; color:var(--ink); border-bottom:1px solid rgba(var(--ink-rgb),.08)}
.rvrow svg{width:38px; height:38px; flex:0 0 38px}
.rvrow .t{font-size:19px; line-height:1.4}
.rvrow .d{font-size:14px; color:rgba(var(--ink-rgb),.6); margin-top:2px}
.rvfoot{font-size:15px; color:rgba(var(--ink-rgb),.7); padding-top:14px; line-height:1.5}
/* 滿 100 收下後，金星飛進今天的格子 */
.flygold{position:fixed; left:0; top:0; width:64px; height:64px; z-index:78; pointer-events:none; --s-fill:var(--gold); --s-stroke:var(--gold-dark); will-change:transform}

/* 矮螢幕（iPhone SE 這種 667px 高）：每一區縮一點，剛好不用捲動 */
@media (max-height: 700px){
  .kids{flex-basis:74px}
  .kid .ava{width:50px; height:50px; font-size:28px}
  .hero{flex-basis:100px}
  .hero-num{font-size:46px}
  .grid{gap:4px}
  .actions{flex-basis:84px}
  .big{height:64px}
  .tip{min-height:44px; font-size:13px}
}
@media (prefers-reduced-motion: reduce){
  .kid.bounce .ava, .grid.slide-l, .grid.slide-r, .cell.shake, .cell.flash, .cell svg.s.pop{animation:none}
  body, .sheet, #reasonPanel, #toast{transition:none}
}
</style>
</head>
<body>

<!-- 星星只畫一次，其他地方都用 <use> 引用；顏色透過 CSS 變數 --s-fill / --s-stroke 傳進來 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="star" viewBox="0 0 24 24">
      <polygon points="12,1.6 14.7,8.88 22.46,9.2 16.37,14.02 18.47,21.5 12,17.2 5.53,21.5 7.63,14.02 1.54,9.2 9.3,8.88"
        style="fill:var(--s-fill,#FFC93C);stroke:var(--s-stroke,#C98A1B);stroke-width:var(--s-sw,1.5)" stroke-linejoin="round"/>
      <ellipse cx="9.6" cy="8.2" rx="1.7" ry="1" fill="#fff" opacity=".8" transform="rotate(-30 9.6 8.2)"/>
    </symbol>
    <symbol id="star-o" viewBox="0 0 24 24">
      <polygon points="12,1.6 14.7,8.88 22.46,9.2 16.37,14.02 18.47,21.5 12,17.2 5.53,21.5 7.63,14.02 1.54,9.2 9.3,8.88"
        fill="none" style="stroke:var(--accent-dark)" stroke-width="1.6" stroke-dasharray="3 2" stroke-linejoin="round"/>
    </symbol>
  </defs>
</svg>

<div id="app">
  <div id="installHint"><div class="ih"><span>用 Safari 的「分享 → 加入主畫面」把它裝成 app：資料才會留著，也才不會被 iPhone 自動清掉。</span><button id="ihClose" aria-label="關閉這個提示">×</button></div></div>

  <header class="kids" id="kids"></header>

  <button class="hero" id="hero">
    <div class="hero-row">
      <svg class="hero-star" style="--s-fill:var(--accent);--s-stroke:var(--accent-dark)"><use href="#star"/></svg>
      <div class="hero-num" id="heroNum">0</div>
      <div class="dots" id="dots"></div>
    </div>
    <div class="hero-sub" id="heroSub"></div>
    <div class="hero-total" id="heroTotal"></div>
  </button>

  <section class="cal">
    <div class="cal-head">
      <button class="nav" id="prevM" aria-label="上個月">‹</button>
      <button class="cal-title" id="calTitle"></button>
      <button class="nav" id="nextM" aria-label="下個月">›</button>
      <button class="backNow hide" id="backNow">回到這個月</button>
    </div>
    <div class="wk"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
    <div class="grid-wrap"><div class="grid" id="grid"></div></div>
  </section>

  <div class="actions">
    <button class="rbtn" id="minusBtn" aria-label="扣除一顆">−</button>
    <button class="big" id="bigBtn"><svg><use href="#star"/></svg><span id="bigBtnTx">今天好棒！</span></button>
    <button class="rbtn" id="editBtn" aria-label="打開今天">✎</button>
  </div>

  <button class="tip" id="tip">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2V17h6v-.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2z"/></svg>
    <span class="pill" id="tipCat"></span>
    <span class="tx" id="tipTx"></span>
  </button>
</div>

<!-- 動畫層 -->
<div id="stampLayer">
  <div class="flash" id="flash"></div>
  <div class="stamp" id="stampEl"><svg><use href="#star"/></svg><span class="semo" id="stampEmo"></span></div>
  <div id="stampTxt"><span class="st">你好棒！</span><span class="ft">你好棒！</span></div>
</div>
<canvas id="fx"></canvas>

<div id="banner" role="status" aria-live="polite"><div class="rb"><div class="t1" id="bannerT1"></div><div class="t2" id="bannerT2"></div></div></div>

<div id="tenlay" aria-hidden="true"><div class="tencard"><div class="tenstars" id="tenStars"></div><div class="tenline" id="tenLine"></div></div></div>

<div id="review" role="dialog" aria-modal="true" aria-label="跟孩子一起看">
  <button class="shx" id="rvClose">關閉</button>
  <div class="rvhead" id="rvHead"></div>
  <div class="rvlist" id="rvList"></div>
  <div class="rvfoot" id="rvFoot"></div>
</div>

<div id="big" role="dialog" aria-modal="true" aria-labelledby="bigH1">
  <div class="who" id="bigWho"></div>
  <button class="skip" id="bigSkip">關閉</button>
  <div class="halo" id="bigHalo"></div>
  <svg class="bigstar" id="bigStar"><use href="#star"/></svg>
  <div class="h1" id="bigH1"></div>
  <div class="h2" id="bigH2"></div>
  <button class="take" id="bigTake">收下 ⭐</button>
</div>

<div id="reasonPanel" role="region" aria-label="蓋章後的選項">
  <div class="ttl"><span aria-live="polite">加上原因？（可以不填）</span></div>
  <div class="chiprow"><div class="chips row" id="rpChips"></div><button id="rpExpand" class="chevx" aria-label="展開全部原因">⌄</button></div>
  <div class="inrow hide" id="rpCustom"><input id="rpInput" placeholder="做了什麼？" maxlength="40" enterkeyhint="done"><button id="rpSave">儲存</button></div>
  <div class="sibs hide" id="rpSibs"></div>
  <div class="rpfoot"><button id="rpSkip">先跳過</button><button id="rpUndo">蓋錯了，拿掉這顆</button></div>
</div>

<div id="toast" role="status" aria-live="polite"><span id="toastTx"></span><button id="toastBtn" class="hide"></button></div>

<div id="cropLay" role="dialog" aria-modal="true" aria-label="調整頭像範圍">
  <p class="cropTtl">拖動照片、調整大小，<br>讓圓圈框住最棒的表情</p>
  <div class="cropBox" id="cropBox"><img id="cropImg" alt=""></div>
  <div class="cropZoom"><span>小</span><input id="cropRange" type="range" min="0" max="100" value="0" aria-label="照片縮放"><span>大</span></div>
  <div class="cropBtns"><button id="cropCancel">取消</button><button id="cropOk">就用這個範圍</button></div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="daySheet" role="dialog" aria-modal="true" aria-label="這一天的紀錄"><div class="hd"><i aria-hidden="true"></i><button class="shx">關閉</button></div><div class="bd" id="dayBd"></div></div>
<div class="sheet" id="deductSheet" role="dialog" aria-modal="true" aria-label="扣除一顆"><div class="hd"><i aria-hidden="true"></i><button class="shx">關閉</button></div><div class="bd" id="deductBd"></div></div>
<div class="sheet" id="recordsSheet" role="dialog" aria-modal="true" aria-label="全部紀錄"><div class="hd"><i aria-hidden="true"></i><button class="shx">關閉</button></div><div class="bd" id="recordsBd"></div></div>
<div class="sheet" id="settingsSheet" role="dialog" aria-modal="true" aria-label="設定"><div class="hd"><i aria-hidden="true"></i><button class="shx">關閉</button></div><div class="bd" id="settingsBd"></div></div>

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════
   好棒印章 — 主程式
   原則：先寫入再播動畫；原因永遠選填；扣除不表演；三個孩子不比較。
   ═══════════════════════════════════════════════════════════════ */

/* ───────── 常數 ───────── */

function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k === 'text') el.textContent = v;           /* 一律 textContent，不用 innerHTML */
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()){
    if (c == null || c === false) continue;
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return el;
}
function svgStar(cls, outline){
  const NS = 'http://www.w3.org/2000/svg';
  const s = document.createElementNS(NS, 'svg');
  if (cls) s.setAttribute('class', cls);
  const u = document.createElementNS(NS, 'use');
  u.setAttribute('href', outline ? '#star-o' : '#star');
  u.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', outline ? '#star-o' : '#star');
  s.append(u);
  return s;
}

/* 選好照片先進「調整範圍」：拖動＋縮放挑出圓圈裡最合適的一塊，
   確定後才裁下來縮到 96px 存 JPEG（三個孩子加起來十幾 KB，撞不到容量） */
function setPhoto(kid, file, done){
  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = () => openCrop(img, url, kid, done);
  img.onerror = () => { URL.revokeObjectURL(url); toast('這張照片讀不進來'); };
  img.src = url;
}
/* 裁切層狀態：s0＝剛好蓋滿圓圈的基準倍率，z＝使用者加的縮放（1–3），ox/oy＝圖左上角位移 */
let crop = null;
function cropApply(){
  if (!crop) return;
  const s = crop.s0 * crop.z;
  /* 圖永遠要蓋滿整個圓圈：位移夾在邊界內 */
  crop.ox = Math.min(0, Math.max(crop.V - crop.w * s, crop.ox));
  crop.oy = Math.min(0, Math.max(crop.V - crop.h * s, crop.oy));
  $('cropImg').style.transform = `translate(${crop.ox}px,${crop.oy}px) scale(${s})`;
}
/* 縮放時以 fx,fy（圓圈內座標）為錨點，指頭壓著的地方不會滑走 */
function cropZoomTo(z2, fx, fy){
  if (!crop) return;
  z2 = Math.min(3, Math.max(1, z2));
  const s1 = crop.s0 * crop.z, s2 = crop.s0 * z2;
  crop.ox = fx - (fx - crop.ox) * (s2 / s1);
  crop.oy = fy - (fy - crop.oy) * (s2 / s1);
  crop.z = z2;
  $('cropRange').value = Math.round((z2 - 1) / 2 * 100);
  cropApply();
}
function openCrop(img, url, kid, done){
  const lay = $('cropLay'), box = $('cropBox'), im = $('cropImg');
  lay.classList.add('on');
  const V = box.clientWidth;
  const w = img.naturalWidth, h2 = img.naturalHeight;
  if (!V || !w || !h2){ lay.classList.remove('on'); URL.revokeObjectURL(url); toast('這張照片處理不了'); return; }
  im.src = url;
  im.style.width = w + 'px'; im.style.height = h2 + 'px';
  const s0 = V / Math.min(w, h2);
  crop = { img, url, kid, done, V, w, h:h2, s0, z:1, ox:(V - w * s0) / 2, oy:(V - h2 * s0) / 2 };
  $('cropRange').value = 0;
  cropApply();
}
function closeCrop(){
  if (!crop) return;
  $('cropLay').classList.remove('on');
  $('cropImg').src = '';
  URL.revokeObjectURL(crop.url);
  crop = null;
}
(() => {
  const box = $('cropBox');
  const pts = new Map();                    /* 目前按著的指頭：pointerId → {x,y} */
  let pinch0 = 0, z0 = 1;                   /* 捏合起手時的兩指距離與當時倍率 */
  box.addEventListener('pointerdown', e => {
    if (!crop) return;
    e.preventDefault();
    try { box.setPointerCapture(e.pointerId); } catch (err) {}
    pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if (pts.size === 2){
      const [a, b] = [...pts.values()];
      pinch0 = Math.hypot(a.x - b.x, a.y - b.y) || 1; z0 = crop.z;
    }
  });
  box.addEventListener('pointermove', e => {
    if (!crop || !pts.has(e.pointerId)) return;
    const p = pts.get(e.pointerId);
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    const r = box.getBoundingClientRect();
    if (pts.size === 1){                    /* 一指＝拖動 */
      crop.ox += dx; crop.oy += dy; cropApply();
    } else if (pts.size === 2){             /* 兩指＝捏合縮放，錨在兩指中點 */
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      const mx = (a.x + b.x) / 2 - r.left, my = (a.y + b.y) / 2 - r.top;
      cropZoomTo(z0 * (d / pinch0), mx, my);
      crop.ox += dx / 2; crop.oy += dy / 2; cropApply();
    }
  });
  const lift = e => { pts.delete(e.pointerId); };   /* 捏合放掉一指，剩下那指自然回到拖動 */
  box.addEventListener('pointerup', lift);
  box.addEventListener('pointercancel', lift);
  /* 滑鼠滾輪（桌機預覽用）：對著游標縮放 */
  box.addEventListener('wheel', e => {
    if (!crop) return;
    e.preventDefault();
    const r = box.getBoundingClientRect();
    cropZoomTo(crop.z * (e.deltaY < 0 ? 1.08 : 0.93), e.clientX - r.left, e.clientY - r.top);
  }, { passive:false });
  $('cropRange').addEventListener('input', () => {
    if (!crop) return;
    cropZoomTo(1 + $('cropRange').value / 100 * 2, crop.V / 2, crop.V / 2);
  });
  $('cropCancel').addEventListener('click', closeCrop);
  $('cropOk').addEventListener('click', () => {
    if (!crop) return;
    try {
      const S = 96, c = document.createElement('canvas'); c.width = S; c.height = S;
      const g = c.getContext('2d');
      const s = crop.s0 * crop.z;
      g.drawImage(crop.img, -crop.ox / s, -crop.oy / s, crop.V / s, crop.V / s, 0, 0, S, S);
      let d = c.toDataURL('image/jpeg', .82);
      if (d.length > 60000) d = c.toDataURL('image/jpeg', .5);
      crop.kid.photo = d; save(); renderKids();
      if (crop.done) crop.done();
      toast('頭像換好了', { ms:1500 });
    } catch (e) { toast('這張照片處理不了'); }
    closeCrop();
  });
})();

/* Web Animations 小包裝：播完把最後一格寫進 inline style 再取消，避免 fill:forwards 疊一堆 */
function anim(el, kf, o){
  const opt = typeof o === 'number' ? { duration:o } : o;
  let a;
  try { a = el.animate(kf, Object.assign({ fill:'forwards' }, opt)); }
  catch (e) { return Promise.resolve(); }
  return a.finished.then(() => {
    const last = kf[kf.length-1];
    for (const k in last){ if (k !== 'offset' && k !== 'easing') el.style[k] = last[k]; }
    a.cancel();
  }).catch(() => {});
}

/* 把讀進來的資料整理成乾淨的樣子。
   這個函式必須「永遠不拋例外」：它同時是開檔路徑與還原備份路徑，
   一旦拋錯就會退回空白資料，然後被下一次 save() 覆蓋掉真正的紀錄。
   所以一律白名單取值、每個欄位都限長度與數量，不用 Object.assign 照單全收。 */
function normalize(raw){
  const base = fresh();
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return base;
  const str = (v, max) => (typeof v === 'string' ? v : '').slice(0, max);
  const rawSet = (raw.settings && typeof raw.settings === 'object') ? raw.settings : {};
  const lb = typeof rawSet.lastBackupAt === 'string' && !isNaN(new Date(rawSet.lastBackupAt).getTime()) ? rawSet.lastBackupAt : null;
  const strList = (a, max, cap) => [...new Set((Array.isArray(a) ? a : [])
    .filter(x => typeof x === 'string' && x.trim()).map(x => x.trim().slice(0, max)))].slice(0, cap);
  const s = {
    version: 2,
    settings: {
      sound: rawSet.sound === undefined ? true : !!rawSet.sound,
      lastBackupAt: lb,
      hintDismissed: !!rawSet.hintDismissed,
      /* 字數上限統一 40：面板/補原因輸入框都放行 40 字，這裡砍 30 會讓同一原因變成截斷版＋完整版兩顆 chip */
      customReasons: strList(rawSet.customReasons, 40, 40),
      hiddenReasons: strList(rawSet.hiddenReasons, 40, 40),
      customDeductReasons: strList(rawSet.customDeductReasons, 40, 40),
      hiddenDeductReasons: strList(rawSet.hiddenDeductReasons, 40, 40),
      autoAddTyped: rawSet.autoAddTyped === undefined ? true : !!rawSet.autoAddTyped,
      recentFirst: !!rawSet.recentFirst,
      addToAll: !!rawSet.addToAll,
      reasonWrap: !!rawSet.reasonWrap,
    },
    lastKid: null, tipOrder: [], tipIndex: 0, kids: [], events: [],
  };

  /* 孩子 1–5 個。id 保留備份裡原有的（k1、k2…）——移除中間的孩子時，
     其他人的紀錄才不會張冠李戴；壞掉或重複的 id 才重發 */
  let rawKids = (Array.isArray(raw.kids) ? raw.kids : []).filter(k => k && typeof k === 'object').slice(0, 5);
  if (!rawKids.length) rawKids = base.kids;
  /* 兩趟：先把「格式合法且不重複」的 id 全部登記，之後才替壞掉的重發——
     一趟做完會讓前面壞掉的孩子偷走後面孩子的合法 id，事件整批張冠李戴 */
  const usedIds = new Set();
  const validId = k => (typeof k.id === 'string' && /^k\d{1,4}$/.test(k.id));
  const dupCheck = new Set();
  for (const k of rawKids){
    if (validId(k) && !dupCheck.has(k.id)){ usedIds.add(k.id); }
    if (validId(k)) dupCheck.add(k.id);
  }
  const claimed = new Set();
  s.kids = rawKids.map((k, i) => {
    /* 超出預設數的孩子（第 3 個起）不能回退到 base.kids 的循環，會撞成跟老大同名同頭像 */
    const d = base.kids[i] || null;
    const emoji = Array.from(str(k.emoji, 16)).slice(0, 2).join('') || (d ? d.emoji : ['🦊', '🐻', '🐥'][i % 3]);
    let kidId = (validId(k) && usedIds.has(k.id) && !claimed.has(k.id)) ? k.id : null;
    if (!kidId){ let nn = 1; while (usedIds.has('k' + nn) || claimed.has('k' + nn)) nn++; kidId = 'k' + nn; }
    claimed.add(kidId);
    return {
      id: kidId,
      name: (str(k.name, 12).trim()) || (d ? d.name : `寶貝${i + 1}`),
      emoji,
      /* 常用原因每個孩子各一份；舊備份只有全家共用的那份時，每個孩子先繼承它 */
      customReasons: Array.isArray(k.customReasons) ? strList(k.customReasons, 40, 40) : [...s.settings.customReasons],
      hiddenReasons: Array.isArray(k.hiddenReasons) ? strList(k.hiddenReasons, 40, 40) : [...s.settings.hiddenReasons],
      customDeductReasons: Array.isArray(k.customDeductReasons) ? strList(k.customDeductReasons, 40, 40) : [...s.settings.customDeductReasons],
      hiddenDeductReasons: Array.isArray(k.hiddenDeductReasons) ? strList(k.hiddenDeductReasons, 40, 40) : [...s.settings.hiddenDeductReasons],
      /* 設定頁拖出來的順序（含內建與自訂）；不在清單裡的照原本順序接在後面 */
      reasonOrder: strList(k.reasonOrder, 40, 90),
      deductReasonOrder: strList(k.deductReasonOrder, 40, 90),
      /* 只收 base64 的點陣圖：SVG 或夾雜其他字元的 data URI 一律不收（防 CSS 注入） */
      photo: (typeof k.photo === 'string' && k.photo.length <= 120000 && /^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(k.photo)) ? k.photo : null,
      theme: (Number.isInteger(k.theme) && k.theme >= 0 && k.theme < THEMES.length) ? k.theme : i % THEMES.length,
      celebrated: (Array.isArray(k.celebrated) ? k.celebrated : [])
        .map(Number).filter(n => Number.isInteger(n) && n > 0 && n <= 1e6).slice(-500),
      recentReasons: strList(k.recentReasons, 60, 6),
    };
  });

  const kidIds = new Set(s.kids.map(k => k.id));
  const ids = new Set();
  s.events = (Array.isArray(raw.events) ? raw.events : [])
    .filter(e => e && typeof e === 'object'
      && ['plus', 'minus', 'gold', 'adjust', 'redeem'].includes(e.type)
      && /^\d{4}-\d{2}-\d{2}$/.test(e.date || '')
      && dkey(parseKey(e.date)) === e.date            /* 2026-02-30 這種不存在的日期擋掉 */
      && kidIds.has(e.kid))
    .slice(0, 60000)
    .map((e, i) => {
      let ts = Number(e.ts);
      if (!Number.isFinite(ts) || ts < 0 || ts > 8.64e15) ts = 0;
      let id = str(e.id, 40) || ('e' + ts + '-' + i);
      while (ids.has(id)) id = id + '-' + i;          /* id 撞號會讓刪除／補原因動到錯的那一筆 */
      ids.add(id);
      const n = Number(e.n);
      const out = { id, kid:e.kid, type:e.type, date:e.date, ts, reason: str(e.reason, 60) };
      if (e.type === 'gold' && Number.isInteger(n) && n > 0) out.n = n;
      /* 超界的一律整筆丟棄，不改寫成別的數字——改寫會讓帳憑空生出可用數 */
      if (e.type === 'redeem') out.n = (Number.isInteger(n) && n > 0 && n <= 100000) ? n : 0;
      if (e.type === 'adjust') out.n = (Number.isInteger(n) && n !== 0 && Math.abs(n) <= 100000) ? n : 0;
      return out;
    })
    .filter(e => (e.type !== 'adjust' || e.n !== 0) && (e.type !== 'redeem' || e.n > 0));

  s.lastKid = (typeof raw.lastKid === 'string' && kidIds.has(raw.lastKid)) ? raw.lastKid : s.kids[0].id;
  s.tipOrder = (Array.isArray(raw.tipOrder) ? raw.tipOrder : [])
    .filter(i => Number.isInteger(i) && i >= 0 && i < TIPS.length);
  s.tipIndex = Math.min(Math.max(0, Number(raw.tipIndex) || 0), s.tipOrder.length);
  /* v1 → v2：滿 N 統計改成只看「蓋章 − 扣除」（調整不進統計）。
     v1 的調整曾把跨過的滿 10 靜默補進 celebrated——這批要清掉，
     不然帶著舊帳的孩子（celebrated 已有 10、20）永遠等不到下一次慶祝。
     只在舊版資料上做一次：v2 之後「扣到低於已慶祝數字」是合法狀態，不能每次都剪 */
  if ((Number(raw.version) || 1) < 2){
    for (const k of s.kids){
      const sn = s.events.filter(e => e.kid === k.id && e.type === 'plus').length
               - s.events.filter(e => e.kid === k.id && e.type === 'minus').length;
      k.celebrated = k.celebrated.filter(m => m <= Math.max(0, sn));
    }

}

/* ───────── 自動快照 ─────────
   每次改動後把整份資料另外存一份到 IndexedDB，保留最近 20 份與每天最後一份（60 天）。
   這是「誤刪、誤扣、資料毀損」的救命索 —— 但它跟主資料在同一支手機上，
   手機掉了或把 app 刪掉一樣會沒有，所以設定頁還是會催你偶爾匯出一份。 */
const DB_NAME = 'good_job_stamps', STORE = 'snapshots';
let dbPromise = null;
function openDB(){
  if (dbPromise) return dbPromise;
  let settledNull = false;
  dbPromise = new Promise(resolve => {
    try {
      const q = indexedDB.open(DB_NAME, 1);
      q.onupgradeneeded = () => {
        const db = q.result;
        if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath:'ts' });
      };
      q.onsuccess = () => resolve(q.result);
      q.onerror = () => resolve(null);
      setTimeout(() => resolve(null), 3000);
    } catch (e) { resolve(null); }
  }).then(db => {
    /* 開失敗（含逾時）不要把 null 永久快取住：下一次呼叫再試一次 */
    if (!db && !settledNull){ settledNull = true; dbPromise = null; }
    return db;
  });
  return dbPromise;
}
/* ───────── 雲端自動備份（GitHub Gist） ─────────
   iPhone 上的網頁 app 進不了 iCloud，這是 Apple 不開放的；
   做得到「自動」的路是傳到使用者自己的 GitHub 私人 Gist：
   設定一次金鑰，之後每次改動 15 秒後自動上傳、切到背景時立刻上傳。
   金鑰與 Gist 編號存在 localStorage 的另一把鑰匙下（不放進 state），

const GKEY = KEY + '.gist';

function loadGist(){ try { gist = JSON.parse(localStorage.getItem(GKEY) || 'null'); } catch (e) { gist = null; } }

/* gist.pending＝「還沒決定要用雲端還是本機」的持久旗標：
   跟執行期的 pendingCloud 不同，關掉 app 再開它還在，凍結所有上傳直到使用者決定 */
const cloudFrozen = () => pendingCloud || (gist && gist.pending);
function scheduleCloudSync(){
  if (!cloudOn() || cloudFrozen()) return;
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(() => { syncCloud().catch(() => {}); }, 15000);
}
async function syncCloud(force){
  if (!cloudOn() || cloudFrozen()) return false;
  if (cloudBusy){ cloudPending = true; return false; }
  cloudBusy = true;
  const g = gist;          /* 上傳途中被「中斷連線」清掉時，用這個別名安全收尾 */
  let ok = false, retry404 = false;
  try {
    /* 上傳前先核對雲端指紋：上一次寫上去的版本戳（remoteStamp）跟現在雲端的不一樣，
       表示有另一支裝置動過——自動上傳一律擋下，只有使用者親手按「立刻同步」才准覆蓋。
       沒有這道門，舊手機光是被打開，15 秒後就會把幾個月前的資料靜默蓋掉雲端最新備份。 */
    if (g.gistId && g.remoteStamp && !force){
      const chk = await fetch('https://api.github.com/gists/' + g.gistId, {
        headers: { Authorization: 'Bearer ' + g.token, Accept: 'application/vnd.github+json' },
      });
      if (chk.status === 404){ g.gistId = null; g.remoteStamp = null; }
      else if (!chk.ok) throw new Error('GitHub 回應 ' + chk.status);
      else {
        const meta = await chk.json();
        if (meta.updated_at && meta.updated_at !== g.remoteStamp){
          throw new Error('雲端有另一支裝置的更新，先「從雲端拿回」或按「立刻同步」用這支覆蓋');
        }
      }
    }
    const files = { 'haobang-backup.json': { content: JSON.stringify(state, null, 1) } };
    const url = g.gistId ? 'https://api.github.com/gists/' + g.gistId : 'https://api.github.com/gists';
    const res = await fetch(url, {
      method: g.gistId ? 'PATCH' : 'POST',
      headers: { Authorization: 'Bearer ' + g.token, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: JSON.stringify(g.gistId ? { files } : { description: '好棒印章備份（自動同步）', public: false, files }),
    });
    if (res.status === 404 && g.gistId){
      /* 雲端那份被手動刪掉了：忘掉編號，讓控制流自然走出 try、等 finally 放完鎖，
         函式最後一行才重試——在 try 裡直接遞迴或 return，重試不是並發就是根本跑不到 */
      g.gistId = null; g.remoteStamp = null;
      if (gist === g) saveGist();
      retry404 = true;
    } else {
      if (res.status === 401 || res.status === 403) throw new Error('金鑰失效或被撤銷，請重新連線');
      if (!res.ok) throw new Error('GitHub 回應 ' + res.status);
      const j = await res.json();
      g.gistId = j.id; g.remoteStamp = j.updated_at || null;
      g.lastSyncAt = new Date().toISOString(); g.lastError = null;
      if (gist === g){ saveGist(); ok = true; }     /* 途中被中斷連線就不落地也不宣稱成功 */
    }
  } catch (e) {
    g.lastError = (e && e.message) ? e.message : '連不上（可能沒網路）';
    if (gist === g) saveGist();
  } finally {
    cloudBusy = false;                              /* 任何路徑都要放手，不能讓同步永久卡死 */
  }
  if (retry404) return syncCloud(force);            /* 鎖已放乾淨，重試會自己重新上鎖 */
  if (cloudPending){ cloudPending = false; scheduleCloudSync(); }
  if (typeof renderKids === 'function') try { renderKids(); } catch (e) {}
  return ok;
}

async function findCloudBackup(token){
  const res = await fetch('https://api.github.com/gists?per_page=100', {
    headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' },
  });
  if (res.status === 401 || res.status === 403) throw new Error('金鑰不對或沒有 gist 權限');
  if (!res.ok) throw new Error('GitHub 回應 ' + res.status);

async function fetchCloudContent(){
  if (!gist || !gist.gistId) return null;
  const res = await fetch('https://api.github.com/gists/' + gist.gistId, {
    headers: { Authorization: 'Bearer ' + gist.token, Accept: 'application/vnd.github+json' },
  });
  if (!res.ok) throw new Error('GitHub 回應 ' + res.status);
  const j = await res.json();
  /* 讀到哪個版本就記哪個版本的指紋：之後的自動上傳以它為基準判斷有沒有別人動過 */
  if (gist && j.updated_at){ gist.remoteStamp = j.updated_at; saveGist(); }

  if (f.truncated && f.raw_url){ const r = await fetch(f.raw_url); return r.ok ? r.text() : null; }

}

let snapTimer = 0;
function scheduleSnapshot(){
  clearTimeout(snapTimer);
  /* 節流：連蓋五顆只會在最後存一份，不會每按一下就寫一次資料庫 */
  snapTimer = setTimeout(() => { takeSnapshot().catch(() => {}); }, 4000);
}
async function takeSnapshot(){
  const db = await openDB();
  if (!db) return;
  const raw = JSON.stringify(state);
  const now = Date.now();
  const rec = {
    ts: now, day: todayKey(), raw,
    stars: state.kids.map(k => ({ name:k.name, emoji:k.emoji, n:netOf(k.id) })),
    events: state.events.length,
  };
  await new Promise(res => {
    try {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(rec);
      tx.oncomplete = res; tx.onerror = res; tx.onabort = res;
    } catch (e) { res(); }
  });
  await pruneSnapshots(db);
}
async function listSnapshots(){
  const db = await openDB();
  if (!db) return [];
  return new Promise(res => {
    try {
      const out = [];
      const cur = db.transaction(STORE).objectStore(STORE).openCursor(null, 'prev');
      cur.onsuccess = () => { const c = cur.result; if (!c) return res(out); out.push(c.value); c.continue(); };
      cur.onerror = () => res(out);
    } catch (e) { res([]); }
  });
}
async function pruneSnapshots(db){
  const all = await listSnapshots();
  if (all.length <= 20) return;
  const keep = new Set(all.slice(0, 20).map(r => r.ts));      /* 最近 20 份一定留著 */
  const seenDay = new Set(); const cutoff = Date.now() - 60 * 864e5;
  for (const r of all){
    if (keep.has(r.ts)) { seenDay.add(r.day); continue; }
    if (r.ts >= cutoff && !seenDay.has(r.day)){ seenDay.add(r.day); keep.add(r.ts); }   /* 每天再留最新的一份 */
  }
  const drop = all.filter(r => !keep.has(r.ts)).map(r => r.ts);
  if (!drop.length) return;
  try {
    const tx = db.transaction(STORE, 'readwrite');
    const os = tx.objectStore(STORE);
    drop.forEach(ts => os.delete(ts));
  } catch (e) {}
}

/* 推算值（不存） */
const kidById = id => state.kids.find(k => k.id === id);

/* 收集數：蓋章 − 扣除。大數字、進度點、滿 10/100 都看它。
   「調整」不算在內（使用者拍板：以前在別處累積的是舊帳，只進總好棒可兌換數，
   不進任何統計）；兌換也「不」動這個數——孩子做到的事不會變少。 */
const netOf = kid => {
  let n = 0;
  for (const e of eventsOf(kid)){
    if (e.type === 'plus') n++;

/* 可以用的原因清單＝內建的（扣掉這個孩子收起來的）＋ 這個孩子自己加的。
   每個孩子各一份：年紀不同，常做的事、會踩的雷本來就不一樣 */
function reasonPool(kid, deduct){
  const base = deduct ? DEDUCT_REASONS : REASONS;
  const hidden = deduct ? kid.hiddenDeductReasons : kid.hiddenReasons;
  const custom = deduct ? kid.customDeductReasons : kid.customReasons;
  return [...base.filter(r => !hidden.includes(r)), ...custom];

/* 照設定頁拖出來的順序排；沒被排過的（例如剛自動加入的）照原本順序接在後面 */
function orderedPool(kid, deduct){
  const pool = reasonPool(kid, deduct);
  const ord = (deduct ? kid.deductReasonOrder : kid.reasonOrder) || [];
  if (!ord.length) return pool;
  const pos = new Map(ord.map((r, i) => [r, i]));
  /* sort 是穩定的：都不在 ord 裡的兩個會維持 pool 原順序 */
  return [...pool].sort((a, b) => (pos.has(a) ? pos.get(a) : 1e9) - (pos.has(b) ? pos.get(b) : 1e9));

   預設接在清單後面，不打亂排好的位置；浮動模式就跟其他最近的一起排前面。
   被親手「收起」的內建原因例外——不准借道「最近用過」溜回來 */
function reasonChipsFor(kid){
  const pool = orderedPool(kid, false);
  const recents = kid.recentReasons.filter(r => !kid.hiddenReasons.includes(r));
  const extras = recents.filter(r => !pool.includes(r));
  if (!state.settings.recentFirst) return [...pool, ...extras];

function rememberReason(kid, r, deduct){
  if (!r || !kid) return;

  const base = deduct ? DEDUCT_REASONS : REASONS;
  const custom = deduct ? kid.customDeductReasons : kid.customReasons;
  /* 手打過的原因自動變成這個孩子的常用選項（設定頁可以關掉；關掉時只留在「最近用過」）。
     滿 40 就不收——跟設定頁的上限行為一致，不無聲擠掉使用者自己排好的舊原因 */

function swapRemember(job, kid2, newR){
  if (!kid2) return;
  job.autoAdded = job.autoAdded || {};
  const old = job.autoAdded[kid2.id];
  if (old && old !== newR){
    const ci = kid2.customReasons.indexOf(old);
    if (ci >= 0) kid2.customReasons.splice(ci, 1);
    kid2.recentReasons = kid2.recentReasons.filter(x => x !== old);
    delete job.autoAdded[kid2.id];
  }
  const wasThere = !newR || REASONS.includes(newR) || kid2.customReasons.includes(newR) || kid2.recentReasons.includes(newR);
  rememberReason(kid2, newR);
  if (!wasThere) job.autoAdded[kid2.id] = newR;

/* 累積了一些紀錄、又超過 14 天沒把備份帶出這支手機，就該提醒了。

function backupOverdue(){
  if (state.events.length < 10) return false;
  if (cloudOn() && gist.lastSyncAt && Date.now() - new Date(gist.lastSyncAt).getTime() < 3 * 864e5) return false;
  const lb = state.settings.lastBackupAt ? new Date(state.settings.lastBackupAt).getTime() : 0;
  return Date.now() - lb > 14 * 864e5;

function renderHero(){
  const k = cur(); const n = netOf(k.id);
  $('heroNum').textContent = n;
  const dots = $('dots'); dots.textContent = '';
  for (let i = 0; i < 10; i++) dots.append(h('i', { class: i < n % 10 ? 'on' : '' }));
  const ms = monthStats(k.id, view.y, view.m);
  const nextMile = n % 10 === 0 && n > 0 ? n + 10 : Math.ceil((n + 1) / 10) * 10;
  const nextBig = Math.ceil((n + 1) / 100) * 100;
  const left = (nextBig - n <= 10 ? nextBig : nextMile) - n;
  const parts = [`${view.y === new Date().getFullYear() && view.m === new Date().getMonth() ? '這個月' : `${view.m+1} 月`} ⭐ ${ms.plus}`];
  if (ms.minus) parts.push(`扣 ${ms.minus}`);
  parts.push(`再 ${left} 顆滿 ${n + left}`);
  if (!lastSaveOk) parts.push('⚠️ 尚未存檔');
  $('heroSub').textContent = parts.join(' ・ ');

  /* 第二行：隨時看得到「總好棒」可以換幾顆（使用者拍板：可兌換數要常駐主畫面；
     「一共蓋過／扣過」的歷史統計退到紀錄頁看）。大數字照舊是收集數，不因兌換變少 */
  const all = eventsOf(k.id);
  const totalPlus = all.filter(e => e.type === 'plus').length;
  const W = walletOf(k.id);
  const hasEcon = all.some(e => e.type === 'redeem' || e.type === 'adjust');
  const el = $('heroTotal'); el.textContent = '';
  let totalText = '';
  if (totalPlus || hasEcon){
    el.append('總好棒 ', h('b', { text:String(W) }), ' 顆可以換');
    totalText = `總好棒 ${W} 顆可以換`;
    const first = all.filter(e => e.type === 'plus').map(e => e.date).sort()[0];
    if (first){
      const fd = parseKey(first);
      const days = Math.floor((parseKey(todayKey()) - fd) / 864e5) + 1;
      const tail = ` ・ 從 ${fd.getMonth()+1}/${fd.getDate()} 起第 ${days} 天`;
      el.append(tail); totalText += tail;

function renderCalendar(){
  const k = cur(); const map = dayMap(k.id);
  $('calTitle').textContent = `${view.y} 年 ${view.m+1} 月`;
  const grid = $('grid'); grid.textContent = '';
  const first = new Date(view.y, view.m, 1);
  const startDow = first.getDay();
  const dim = new Date(view.y, view.m+1, 0).getDate();
  for (let i = 0; i < 42; i++){
    const day = i - startDow + 1;
    if (day < 1 || day > dim){ grid.append(h('div', { class:'cell blank' })); continue; }
    const key = `${view.y}-${pad(view.m+1)}-${pad(day)}`;
    grid.append(buildCell(key, day, map[key] || []));
  }
  /* 滑到別的月份時，給一條看得見的路回來（點標題那個彩蛋沒人知道） */
  const now = new Date();
  $('backNow').classList.toggle('hide', view.y === now.getFullYear() && view.m === now.getMonth());
}
function buildCell(key, day, evs){
  const plus = evs.filter(e => e.type==='plus').length;
  const minus = evs.filter(e => e.type==='minus').length;
  const gold = evs.some(e => e.type==='gold');
  const isToday = key === TODAY, future = key > TODAY;
  const cell = h('button', { class:'cell' + (plus ? ' has' : '') + (isToday ? ' today' : '') + (future ? ' future' : '') + (gold ? ' gold' : ''),
    'data-date': key, 'aria-label': `${Number(key.slice(5,7))} 月 ${day} 日${isToday ? '，今天' : ''}，${plus} 顆星星${minus ? `，${minus} 次扣除` : ''}${gold ? '，有金色紀念章' : ''}`,
    onclick: () => onCellTap(key, cell) });
  cell.append(h('span', { class:'d', text:day }));
  if (isToday && plus === 0) cell.append(svgStar('o', true));
  /* 5、6 顆也真的畫出來：孩子是用眼睛數星星的，最厲害的那天不該縮成一個小字 */
  const layouts = {
    1: [[50,56,24]],
    2: [[30,55,18],[70,60,18]],
    3: [[50,42,16],[32,72,16],[68,72,16]],
    4: [[35,45,14],[65,45,14],[35,75,14],[65,75,14]],
    5: [[32,44,12],[68,44,12],[50,59,12],[32,75,12],[68,75,12]],
    6: [[28,45,11],[50,42,11],[72,45,11],[28,75,11],[50,78,11],[72,75,11]],
  };
  const lay = plus >= 7 ? [[50,56,24]] : (layouts[plus] || []);
  lay.forEach(([x, y, sz], idx) => {
    const s = svgStar('s');
    const rot = (day*7 + idx*13) % 17 - 8;
    s.style.cssText = `left:${x}%;top:${y}%;width:${sz}px;height:${sz}px;--r:${rot}deg`;
    cell.append(s);
  });
  if (plus >= 7) cell.append(h('span', { class:'x', text:'×'+plus }));
  if (gold){ const g = svgStar('g' + (minus ? ' withm' : '')); cell.append(g); }

}
function onCellTap(key, cell){
  /* 用當下算出來的今天，不用快取的 TODAY：app 開著跨過午夜時，新的一天不該被當成未來 */
  if (key > todayKey()){ cell.classList.remove('shake'); void cell.offsetWidth; cell.classList.add('shake'); return; }

    const s = stars[stars.length-1];
    s.classList.remove('pop'); void s.offsetWidth; s.classList.add('pop');

  } else openDay(key);
}
function gotoMonth(dy, dir){

(() => {

/* ───────── 粒子引擎（一張 canvas、一個 rAF 迴圈、沒粒子就停） ───────── */
const FX = (() => {

    cv.width = W*dpr; cv.height = H*dpr; cv.style.width = W+'px'; cv.style.height = H+'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.save(); ctx.globalAlpha = a; ctx.translate(p.x, p.y);

      ctx.strokeStyle = p.color; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-p.vx*.035, -p.vy*.035); ctx.stroke();
    } else if (p.shape === 'rocket'){
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = p.color; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 22); ctx.stroke();
    } else {
      ctx.rotate(p.rot); ctx.fillStyle = p.color;
      if (p.shape === 'star'){ starPath(p.size/2); ctx.fill(); if (p.stroke){ ctx.strokeStyle = p.stroke; ctx.lineWidth = 1; ctx.stroke(); } }
      else if (p.shape === 'rect'){ ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h); }
      else { ctx.beginPath(); ctx.arc(0, 0, p.size/2, 0, Math.PI*2); ctx.fill(); }
    }

  }

    const dt = Math.min(.05, (now - last)/1000); last = now;
    ctx.clearRect(0, 0, W, H);

      p.t += dt; if (p.t >= p.ttl) return false;
      if (p.update) p.update(p, dt);
      p.vy += p.g*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.rot += p.vr*dt;
      if (p.y > H + 40) return false;

  }
  const rnd = (a, b) => a + Math.random()*(b-a);
  const colors = () => { const t = theme(cur()); return { accent:t.accent, dark:t.accentDark }; };
  return {
    /* 蓋章：24 顆星 + 12 顆圓點，從印章中心往上噴 */
    burst(x, y, goldOnly){
      if (reduceMotion()) return;
      const c = colors();
      for (let i = 0; i < 24; i++){ const a = -Math.PI/2 + rnd(-1.75, 1.75), v = rnd(300, 600);
        add({ shape:'star', x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, g:900, size:rnd(12, 20), color:goldOnly ? '#F5C542' : c.accent, stroke:goldOnly ? '#C98A1B' : c.dark, rot:rnd(0, 6.28), vr:rnd(-6.28, 6.28), ttl:.9, fadeFrom:.66 }); }
      for (let i = 0; i < 12; i++){ const a = -Math.PI/2 + rnd(-1.75, 1.75), v = rnd(250, 550);
        add({ shape:'dot', x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, g:900, size:rnd(4, 7), color: goldOnly ? '#FFF3C4' : (i%2 ? '#fff' : c.accent), ttl:.9, fadeFrom:.66 }); }
    },
    /* 小慶祝：80 片紙花從左右上角斜噴進來 */
    confettiSides(n){
      if (reduceMotion()) return;

      for (let i = 0; i < n; i++){
        const left = i%2 === 0; const a = left ? rnd(.52, 1.05) : Math.PI - rnd(.52, 1.05); const v = rnd(250, 450);

          phase:rnd(0, 6.28), update:(p, dt) => { p.x += Math.sin(p.t*3 + p.phase)*40*dt; } });
      }
    },
    /* 大慶祝：紙花從整條上緣灑下（每片各自延遲入場，才會像一直灑而不是一次噴完） */
    confettiRain(n, dur){
      if (reduceMotion()) return;
      const c = colors(); const pal = [c.accent, '#F5C542', '#FFFFFF', '#E2B14A'];
      for (let i = 0; i < n; i++){
        const delay = rnd(0, dur);
        add({ shape:'rect', x:-100, y:-12, vx:0, vy:0, g:0, w:6, h:10, color:pal[i%4], rot:rnd(0, 6.28), vr:rnd(-3.14, 3.14), ttl:3 + delay, fadeFrom:.85,
          phase:rnd(0, 6.28), delay, spawned:false,

               因為 tick 每一幀都會把重力加到 vy 上，第二幀就不是 0 了 */
            if (p.t < p.delay){ p.x = -100; p.y = -12; p.vx = 0; p.vy = 0; p.g = 0; return; }
            if (!p.spawned){ p.spawned = true; p.x = rnd(0, W); p.y = -12; p.vx = rnd(-30, 30); p.vy = rnd(150, 300); p.g = 60; }
            p.x += Math.sin(p.t*3 + p.phase)*40*dt;
          } });
      }
    },
    /* 煙火：一條火箭上升，到點炸開 60 顆 */

      if (reduceMotion()) return;

      /* ttl 要比上升時間長一點：tick 是「先加 t、超過 ttl 就移除」，
         若 ttl 正好等於上升時間，粒子會在到達頂點的那一幀被丟掉，永遠炸不開 */
      add({ shape:'rocket', x, y:y0, vx:0, vy:0, g:0, color:mainColor, ttl:RISE + .06, fadeFrom:1,
        update:(p, dt) => {

          if (k >= 1 && !p.done){

            for (let i = 0; i < 60; i++){ const a = rnd(0, 6.28), v = rnd(200, 400);
              add({ shape:'spark', x:p.x, y:p.y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, g:300, color:[mainColor, '#fff', c.accent][i%3], ttl:1.2, fadeFrom:.3 }); }
          }
        } });
    },
  };
})();

/* ───────── sheet 共用 ───────── */

/* 拖把往下拉 > 80px 關閉 */
document.querySelectorAll('.sheet .hd').forEach(hd => {
  let y0 = 0, dy = 0, sheet = hd.parentElement;
  hd.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; dy = 0; sheet.classList.add('drag'); }, { passive:true });
  hd.addEventListener('touchmove', e => { dy = Math.max(0, e.touches[0].clientY - y0); sheet.style.transform = `translateY(${dy}px)`; }, { passive:true });

/* ───────── chips 元件：回傳 {el, value()} ───────── */
/* 原因選單（扣好棒、補蓋日期共用）：跟蓋章面板同一套——
   「其他…」固定第一顆、單行左右滑、右端「⌄」展開多行，展不展開跟主面板共用同一個記憶 */
function chipPicker(list, opt){
  opt = opt || {};
  let value = '';
  const wrap = h('div');
  const chips = h('div', { class:'chips row' + (state.settings.reasonWrap ? ' wrap' : '') });
  const custom = h('div', { class:'inrow hide' });
  const input = h('input', { placeholder: opt.placeholder || '做了什麼？', maxlength:'40', enterkeyhint:'done' });
  const saveBtn = h('button', { text:'儲存', onclick: () => { value = input.value.trim(); if (opt.onPick) opt.onPick(value, true); } });
  input.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); saveBtn.click(); } });
  custom.append(input, saveBtn);
  function setOn(btn){ chips.querySelectorAll('.chip').forEach(c => { c.classList.remove('on'); c.setAttribute('aria-pressed', 'false'); }); if (btn){ btn.classList.add('on'); btn.setAttribute('aria-pressed', 'true'); } }
  const other = h('button', { class:'chip' + (opt.grey ? ' grey' : ''), text:'其他…', onclick: () => { setOn(other); value = ''; custom.classList.remove('hide'); input.focus(); if (opt.onOther) opt.onOther(); } });
  chips.append(other);
  for (const r of list){
    const c = h('button', { class:'chip' + (opt.grey ? ' grey' : ''), text:r, 'aria-pressed':'false', onclick: () => {
      if (c.classList.contains('on')){ setOn(null); value = ''; custom.classList.add('hide'); if (opt.onPick) opt.onPick('', false); return; }
      setOn(c); value = r; custom.classList.add('hide'); if (opt.onPick) opt.onPick(r, false);
    } });
    chips.append(c);
  }
  const ex = h('button', { class:'chevx' + (state.settings.reasonWrap ? ' up' : ''), text:'⌄',
    'aria-label': state.settings.reasonWrap ? '收成一行' : '展開全部原因', onclick: () => {
      state.settings.reasonWrap = !state.settings.reasonWrap; save();
      chips.classList.toggle('wrap', state.settings.reasonWrap);
      ex.classList.toggle('up', state.settings.reasonWrap);
      ex.setAttribute('aria-label', state.settings.reasonWrap ? '收成一行' : '展開全部原因');
    } });
  wrap.append(h('div', { class:'chiprow' }, chips, ex), custom);
  return { el:wrap, value: () => (custom.classList.contains('hide') ? value : input.value.trim()), input };
}

/* ───────── 蓋章（資料） ─────────
   先寫入再播動畫。回傳的是一張「動畫工單」而不是事件本身：
   quick / net 這些只給動畫用的欄位不能混進 state.events，否則會被存進備份 JSON。
   net 是「這一筆落下的當下」的淨值 —— 家長連按兩下時，兩筆都已寫入，
   等動畫播到第二顆才去算 netOf 就會跳過中間的第 10 顆。 */
function addStamp(kidId, date, reason, quick){
  const ev = { id:newId(), kid:kidId, type:'plus', date, ts:Date.now(), reason:reason || '' };
  state.events.push(ev);
  if (reason) rememberReason(kidById(kidId), reason);
  save();
  /* 動畫的大字是全 app 最大聲的一句話：有原因就唸出那件事（過程讚美），
     沒原因就中性的「做到了」——名字＋事實，不做名字＋評價 */
  const kid = kidById(kidId);
  const label = reason ? `${kid.name}，${String(reason).trim()}！` : `${kid.name}，做到了！`;
  return { id:ev.id, kid:kidId, date, quick:!!quick, net:netOf(kidId), label };
}
function removeEvent(id){
  const i = state.events.findIndex(e => e.id === id);
  if (i < 0) return false;
  state.events.splice(i, 1);
  /* 調整從 v2 起不碰 celebrated，刪調整也就不用回收什麼 */
  save(); return true;
}

/* ───────── 蓋章動畫（1250ms）＋佇列 ───────── */
const Q = []; let playing = false; let lastQuick = null;
/* 整份資料被換掉（還原快照/雲端/貼上）時，把排隊中的動畫與面板狀態全部清掉：
   殘留的工單會對「還原後的資料」寫入不屬於它的里程碑 */
function resetRuntime(){ Q.length = 0; lastQuick = null; rpJob = null; try { hideReasonPanel(); } catch (e) {} }
function enqueue(job){ Q.push(job); if (!playing) runQueue(); }
async function runQueue(){
  playing = true; let n = 0;
  try {
    while (Q.length){
      const job = Q.shift();
      /* 每一顆各自包起來：中間一顆的動畫掛掉，不能讓後面排隊的整批消失，
         也不能因此漏掉里程碑判定（那是資料，不是特效） */
      try { await playStamp(job, { fast: n > 0 }); }
      catch (err) { land(job); $('stampLayer').classList.remove('on'); }
      n++;
      /* 這顆若在排隊期間被刪掉（或整份資料被還原），慶祝與里程碑都不能再算它的 */
      if (!state.events.some(e => e.id === job.id)) continue;
      const kid = kidById(job.kid);
      const m = kid ? milestoneFor(kid, job.net) : null;
      if (m){
        job.milestone = m;                          /* 記在工單上：撤銷時才知道「是這一顆觸發的」 */
        if (job.batchRef) job.batchRef.celebrated.push(job.net);
        kid.celebrated.push(job.net); save();       /* 先記再播：播到一半關掉 app 也不會重播 */
        try {
          if (m === 'big') await celebrateHundred(kid, job.net);
          else await celebrateTen(kid, job.net);
        } catch (err) { $('big').classList.remove('on'); $('banner').style.transform = 'translateY(-120%)'; }
      }
      if (job.quick) lastQuick = job;
    }
  } finally {
    playing = false;
    /* 家長若在動畫期間開了別的面板，原因面板別鑽到遮罩底下變成點不到的鬼影 */
    if (lastQuick){
      if (!openSheetId && !$('review').classList.contains('on')) showReasonPanel(lastQuick);
      lastQuick = null;
    }
  }
}
function milestoneFor(kid, T){
  if (T <= 0 || kid.celebrated.includes(T)) return null;
  if (T % 100 === 0) return 'big';
  if (T % 10 === 0) return 'small';
  return null;
}
function targetPoint(ev){
  const cell = ev.kid === state.lastKid ? $('grid').querySelector(`[data-date="${ev.date}"]`) : null;
  const el = cell || $('heroNum');
  const r = el.getBoundingClientRect();
  return { x:r.left + r.width/2, y:r.top + r.height/2, cell:!!cell };
}
async function playStamp(ev, opt){
  /* 批次蓋（「還有誰也做了」）：資料與里程碑照走，動畫只做一聲輕響 */
  if (ev.mini){ SFX.chime(); land(ev); await wait(150); return; }
  const layer = $('stampLayer'), st = $('stampEl'), fl = $('flash'), tx = $('stampTxt'), app = $('app');
  const W = innerWidth, H = innerHeight, cx = W/2, cy = H*.42;
  const base = `translate(${cx-70}px,${cy-70}px)`;
  const kid = kidById(ev.kid);
  const label = ev.label || `${kid ? kid.name : ''}，做到了！`;
  tx.querySelector('.st').textContent = label;
  tx.querySelector('.ft').textContent = label;
  /* 字級跟著長度連續縮：自訂原因最長 40 字，不能讓最大聲的一句話被螢幕裁掉頭尾 */
  const n = Array.from(label).length;
  tx.style.fontSize = Math.max(14, Math.min(34, Math.floor(innerWidth * .92 / Math.max(1, n)))) + 'px';
  const emo = $('stampEmo');
  if (kid && kid.photo){ emo.textContent = ''; emo.style.backgroundImage = `url(${kid.photo})`; }
  else { emo.style.backgroundImage = ''; emo.textContent = kid ? kid.emoji : ''; }
  st.className = 'stamp'; st.style.opacity = '0'; st.style.transform = base; tx.style.opacity = '0'; fl.style.opacity = '0';
  tx.style.left = cx + 'px'; tx.style.top = (cy + 70 + 20) + 'px'; tx.style.transform = 'translate(-50%,0) scale(1)';
  layer.classList.add('on');
  if (reduceMotion()){
    await anim(st, [{ opacity:0 }, { opacity:1 }], 200);
    SFX.pop(); SFX.chime();
    tx.style.opacity = '1';
    await wait(500);
    land(ev); st.style.opacity = '0'; tx.style.opacity = '0';
    await wait(100); layer.classList.remove('on'); return;
  }
  /* 預備一拍：印章先完整現身、微微上抬蓄力——孩子要先看到那顆要砸下來的東西，
     衝擊才有重量。連蓋時縮短這一拍，但落下段永遠全速全重（第二顆不能比較不值錢）。 */
  await anim(st, [
    { transform:`translate(${cx-70}px,${cy-165}px) scale(1.08) rotate(-3deg)`, opacity:0 },
    { transform:`translate(${cx-70}px,${cy-173}px) scale(1.1) rotate(-3deg)`, opacity:1 },
  ], { duration: opt.fast ? 70 : 140, easing:'ease-out' });
  await anim(st, [
    { transform:`translate(${cx-70}px,${cy-173}px) scale(1.1) rotate(-3deg)`, opacity:1 },
    { transform:`${base} scale(1) rotate(0deg)`, opacity:1 },
  ], { duration:180, easing:'cubic-bezier(.5,0,1,.6)' });
  /* 落地：方向性擠壓（垂直壓扁、水平擠寬），才像撞擊不像脈衝 */
  SFX.pop();
  fl.style.transform = `translate(${cx-100}px,${cy-100}px) scale(.2)`;
  anim(fl, [{ transform:`translate(${cx-100}px,${cy-100}px) scale(.2)`, opacity:.35 }, { transform:`translate(${cx-100}px,${cy-100}px) scale(2.6)`, opacity:0 }], { duration:280, easing:'cubic-bezier(0,.6,.4,1)' });
  anim(app, [{ transform:'translateY(2px)' }, { transform:'none' }], 80);
  FX.burst(cx, cy);
  await anim(st, [
    { transform:`${base} scale(1,1)` },
    { transform:`${base} scale(1.14,.84)`, offset:.4 },
    { transform:`${base} scale(.96,1.05)`, offset:.72 },
    { transform:`${base} scale(1,1)` },
  ], 150);
  /* 大字彈出 + 三連音 */
  SFX.chime();
  anim(tx, [{ transform:'translate(-50%,0) scale(.5)', opacity:0 }, { transform:'translate(-50%,0) scale(1.1)', opacity:1, offset:.7 }, { transform:'translate(-50%,0) scale(1)', opacity:1 }], { duration:220, easing:'cubic-bezier(.34,1.56,.64,1)' });
  /* 連蓋時砍的是這段沒有資訊量的停留，不是落下的力道 */
  await wait(opt.fast ? 170 : 380);
  /* 飛回格子：走一道上弧、加速進場，落格才有「釘上去」的感覺 */
  const t = targetPoint(ev);
  anim(tx, [{ opacity:1 }, { opacity:0 }], 200);
  await anim(st, [
    { transform:`${base} scale(1)` },
    { transform:`translate(${(cx + t.x)/2 - 70}px,${Math.min(cy, t.y) - 126}px) scale(.62)`, offset:.55 },
    { transform:`translate(${t.x-70}px,${t.y-70}px) scale(.22)` },
  ], { duration:400, easing:'cubic-bezier(.5,0,.9,.6)' });
  st.style.opacity = '0';
  land(ev);
  await wait(opt.fast ? 80 : 150);
  layer.classList.remove('on');
}
/* 動畫落地：重畫格子、新那顆星 pop、總數 bump、進度點 pop */
function land(ev){
  renderAll();
  if (ev.kid !== state.lastKid) return;
  const cell = $('grid').querySelector(`[data-date="${ev.date}"]`);
  if (cell){
    const stars = cell.querySelectorAll('svg.s'); const s = stars[stars.length-1];
    if (s) s.classList.add('pop');
    cell.classList.add('flash'); setTimeout(() => cell.classList.remove('flash'), 250);
  }
  anim($('heroNum'), [{ transform:'scale(1.25)' }, { transform:'scale(1)' }], 200);
  const n = netOf(ev.kid); const d = $('dots').children[(n-1+10) % 10];
  if (d && n % 10 !== 0) anim(d, [{ transform:'scale(0)' }, { transform:'scale(1.4)', offset:.6 }, { transform:'scale(1)' }], 200);
